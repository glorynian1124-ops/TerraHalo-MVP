<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业工作台 - 沃土之环</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <script src="assets/vendor/tailwind.js"></script>
  <script src="assets/vendor/lucide.js"></script>
  <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--th-background);
    --color-foreground: var(--th-foreground);
    --color-card: var(--th-card);
    --color-card-foreground: var(--th-card-foreground);
    --color-primary: var(--th-primary);
    --color-primary-foreground: var(--th-primary-foreground);
    --color-secondary: var(--th-secondary);
    --color-secondary-foreground: var(--th-secondary-foreground);
    --color-muted: var(--th-muted);
    --color-muted-foreground: var(--th-muted-foreground);
    --color-accent: var(--th-accent);
    --color-accent-foreground: var(--th-accent-foreground);
    --color-border: var(--th-border);
    --color-input: var(--th-input);
    --color-ring: var(--th-ring);
  }
  </style>
</head>
<body style="font-family: var(--th-font-sans); margin: 0; background: var(--th-background); color: var(--th-foreground); min-height: 100vh;">

  <!-- 顶部导航 -->
  <header style="position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 56px; background: var(--th-card); border-bottom: 1px solid var(--th-border); display: flex; align-items: center; padding: 0 16px;">
    <div style="display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0;">
      <button id="sidebar-toggle" class="lg:hidden" style="background:none;border:none;cursor:pointer;color:var(--th-foreground);padding:4px;display:flex;align-items:center;"><i data-lucide="menu" style="width:20px;height:20px;"></i></button>
      <span style="font-size: 20px; line-height: 1;">🌱</span>
      <span class="th-h3" style="font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0;">有机肥厂</span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px; flex-shrink: 0;">
      <button id="bell" style="background: none; border: none; cursor: pointer; padding: 4px; color: var(--th-muted-foreground); position: relative; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--th-radius-full);">
        <i data-lucide="bell" style="width: 20px; height: 20px;"></i>
        <span id="bell-dot" style="position: absolute; top: 4px; right: 6px; width: 7px; height: 7px; border-radius: var(--th-radius-full); background: var(--th-state-error);"></span>
      </button>
      <button id="user-menu" style="background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; gap: 8px; color: var(--th-foreground); font-size: var(--th-font-size-sm);">
        <span style="width: 32px; height: 32px; border-radius: var(--th-radius-full); background: var(--th-primary); color: var(--th-primary-foreground); display: flex; align-items: center; justify-content: center; font-size: var(--th-font-size-xs); font-weight: 600;">厂</span>
        <span class="hidden sm:inline" style="white-space: nowrap;">张厂长</span>
        <i data-lucide="chevron-down" style="width: 14px; height: 14px; color: var(--th-muted-foreground);"></i>
      </button>
      <button id="logout-btn" class="inline-flex items-center gap-1.5 rounded-full h-9 px-3.5 text-sm font-medium transition-opacity hover:opacity-80" style="background:var(--th-secondary); color:var(--th-secondary-foreground); border:1px solid var(--th-border); cursor:pointer;" title="退出登录">
        <i data-lucide="log-out" style="width:16px;height:16px;"></i>
        <span class="hidden sm:inline">退出</span>
      </button>
    </div>
  </header>

  <!-- 通知待办面板 -->
  <div id="bell-panel" style="display:none; position:fixed; top:62px; right:16px; width:330px; max-width:calc(100vw - 32px); background:var(--th-card); border:1px solid var(--th-border); border-radius:var(--th-radius); box-shadow:var(--th-shadow-lg); z-index:60; overflow:hidden;">
    <div style="padding:14px 16px; border-bottom:1px solid var(--th-border); display:flex; align-items:center; justify-content:space-between; gap:12px;">
      <span class="th-h3" style="font-size:1rem; margin:0;">待办事项</span>
      <span id="bell-count" style="display:inline-flex;align-items:center;padding:2px 10px;border-radius:var(--th-radius-full);background:var(--th-state-error);color:#fff;font-size:var(--th-font-size-xs);font-weight:600;">0</span>
    </div>
    <div id="bell-list" style="max-height:340px; overflow-y:auto;"></div>
    <div style="padding:10px 16px; border-top:1px solid var(--th-border); text-align:center;">
      <a href="#" id="bell-clear" style="font-size:var(--th-font-size-sm); color:var(--th-muted-foreground); text-decoration:none;">全部已读</a>
    </div>
  </div>

  <!-- 移动端侧栏抽屉 -->
  <div class="th-drawer" id="sidebar-drawer">
    <div class="th-drawer-panel" style="right:auto; left:0; transform: translateX(-100%);">
      <div class="flex items-center justify-between mb-4">
        <span class="th-h3" style="font-size:1.1rem;">功能导航</span>
        <button id="sidebar-close" style="background:var(--th-secondary);border:none;width:36px;height:36px;border-radius:var(--th-radius-full);cursor:pointer;color:var(--th-muted-foreground);display:inline-flex;align-items:center;justify-content:center;"><i data-lucide="x" style="width:18px;height:18px;"></i></button>
      </div>
      <nav id="sidebar-nav-mobile" class="flex flex-col"></nav>
    </div>
  </div>

  <!-- 侧栏 + 主内容 -->
  <div style="display: flex; padding-top: 56px; min-height: calc(100vh - 56px);">
    <!-- 桌面侧栏 -->
    <aside class="hidden lg:flex" style="width: 240px; flex-shrink: 0; background: var(--th-secondary); border-right: 1px solid var(--th-border); padding: 20px 0; flex-direction: column; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto;">
      <nav id="sidebar-nav" class="flex flex-col"></nav>
    </aside>

    <!-- 主内容 -->
    <main style="flex: 1; min-width: 0; padding: 24px 16px;" class="sm:p-6 lg:p-8">
      <div id="page-content">
      <section style="margin-bottom: 24px;">
        <h1 style="font-size: var(--th-font-size-h2); font-weight: 600; line-height: var(--th-line-height-snug); color: var(--th-foreground); margin: 0 0 4px 0;">欢迎回来，有机肥厂</h1>
        <p class="th-body-sm" style="margin: 0; color: var(--th-muted-foreground);" id="today-text"></p>
      </section>

      <!-- KPI -->
      <section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4" style="margin-bottom: 24px;" id="kpi-cards"></section>

      <!-- 待办 + 收运任务 -->
      <section class="grid grid-cols-1 lg:grid-cols-3 gap-6" style="margin-bottom: 24px;">
        <div style="min-width: 0;">
          <h2 class="th-h3" style="margin: 0 0 16px 0;">待办事项</h2>
          <div class="flex flex-col gap-3" id="todo-list"></div>
        </div>
        <div class="lg:col-span-2" style="min-width: 0;">
          <h2 class="th-h3" style="margin: 0 0 16px 0;">近期收运任务</h2>
          <div style="border: 1px solid var(--th-border); border-radius: var(--th-radius); background: var(--th-card); box-shadow: var(--th-shadow-xs); overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; font-size: var(--th-font-size-sm); min-width: 560px;">
              <thead>
                <tr style="border-bottom: 1px solid var(--th-border);">
                  <th style="padding: 12px 16px; text-align: left; color: var(--th-muted-foreground); font-weight: 500; white-space: nowrap;">任务编号</th>
                  <th style="padding: 12px 16px; text-align: left; color: var(--th-muted-foreground); font-weight: 500; white-space: nowrap;">原料类型</th>
                  <th style="padding: 12px 16px; text-align: left; color: var(--th-muted-foreground); font-weight: 500; white-space: nowrap;">司机</th>
                  <th style="padding: 12px 16px; text-align: left; color: var(--th-muted-foreground); font-weight: 500; white-space: nowrap;">状态</th>
                  <th style="padding: 12px 16px; text-align: left; color: var(--th-muted-foreground); font-weight: 500; white-space: nowrap;">日期</th>
                </tr>
              </thead>
              <tbody id="task-tbody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 快捷入口 -->
      <section>
        <h2 class="th-h3" style="margin: 0 0 16px 0;">快捷入口</h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="quick-links"></div>
      </section>
      </div><!-- /page-content -->
    </main>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    var data = TH_DATA.enterprise;

    // 日期
    var now = new Date();
    var week = ['日', '一', '二', '三', '四', '五', '六'][now.getDay()];
    document.getElementById('today-text').textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 · 周' + week;

    // 侧栏导航
    var navItems = [
      { key: 'dashboard', icon: 'layout-dashboard', label: '工作台' },
      { key: 'purchase', icon: 'shopping-cart', label: '采购需求' },
      { key: 'market', icon: 'leaf', label: '原料市场' },
      { key: 'dispatch', icon: 'truck', label: '收运任务' },
      { key: 'products', icon: 'package', label: '商品管理' },
      { key: 'orders', icon: 'clipboard-list', label: '订单管理' },
      { key: 'settle', icon: 'calculator', label: '结算中心' },
      { key: 'settings', icon: 'settings', label: '设置' }
    ];
    var activeNav = 'dashboard';
    var dashboardHtml = null;

    function navItemHtml(item, active) {
      return '<a href="#" class="nav-item" data-key="' + item.key + '" style="display:flex; align-items:center; gap:12px; padding:10px 20px; text-decoration:none; font-size:var(--th-font-size-sm); border-left:3px solid ' + (active ? 'var(--th-primary)' : 'transparent') + '; color:' + (active ? 'var(--th-foreground)' : 'var(--th-secondary-foreground)') + '; background:' + (active ? 'color-mix(in srgb, var(--th-primary) 5%, transparent)' : 'transparent') + '; font-weight:' + (active ? '600' : '400') + ';">' +
        '<i data-lucide="' + item.icon + '" style="width:18px; height:18px; color:' + (active ? 'var(--th-primary)' : 'var(--th-muted-foreground)') + ';"></i><span>' + item.label + '</span></a>';
    }

    function renderNav() {
      var html = navItems.map(function (i) { return navItemHtml(i, i.key === activeNav); }).join('');
      document.getElementById('sidebar-nav').innerHTML = html;
      document.getElementById('sidebar-nav-mobile').innerHTML = navItems.map(function (i) {
        return '<a href="#" class="th-drawer-link nav-item' + (i.key === activeNav ? ' th-drawer-link-active' : '') + '" data-key="' + i.key + '"><i data-lucide="' + i.icon + '" style="width:18px;height:18px;"></i>' + i.label + '</a>';
      }).join('');
      TH.refreshIcons();
    }

    function handleNavClick(key) {
      activeNav = key;
      renderNav();
      document.getElementById('sidebar-drawer').classList.remove('th-drawer-open');
      if (key === 'market') { location.href = 'materials.html'; return; }
      if (key === 'dashboard') { showDashboard(); return; }
      if (key === 'purchase') { showPurchase(); return; }
      if (key === 'dispatch') { showDispatch(); return; }
      if (key === 'products') { showProducts(); return; }
      if (key === 'orders') { showOrders(); return; }
      if (key === 'settle') { showSettle(); return; }
      if (key === 'settings') { showSettings(); return; }
      TH.toast('「' + navItems.find(function (n) { return n.key === key; }).label + '」模块为演示', 'info');
    }

    function showDashboard() {
      document.getElementById('page-content').innerHTML = dashboardHtml;
      renderDashboard();
      TH.refreshIcons();
    }

    /* =====================================================
       采购需求视图
       ===================================================== */
    // 统计卡片元数据（value 由 purchaseList 动态计算）
    var purchaseStats = [
      { label: '采购需求', sub: '全部需求', icon: 'clipboard-list', color: 'var(--th-primary)' },
      { label: '进行中', sub: '含待匹配', icon: 'loader', color: 'var(--th-state-info)' },
      { label: '待审核', sub: '等待平台审核', icon: 'clock', color: 'var(--th-state-warning)' },
      { label: '本月新增', sub: '本月发布的需求', icon: 'trending-up', color: 'var(--th-state-success)' }
    ];

    // 根据实际列表动态计算统计值：[总数, 进行中, 待审核, 本月新增]
    function purchaseStatValues() {
      var cnt = function (t) { return purchaseList.filter(function (p) { return p.statusType === t; }).length; };
      var now = new Date();
      var prefix = now.getFullYear() + '-' + (now.getMonth() + 1 < 10 ? '0' : '') + (now.getMonth() + 1);
      var monthly = purchaseList.filter(function (p) { return p.date.indexOf(prefix) === 0; }).length;
      return [purchaseList.length, cnt('success'), cnt('warning'), monthly];
    }

    var purchaseList = [
      // 进行中（4）
      { no: 'DMD-2026-0601', category: '鸡粪', weight: '50 吨', priceMin: 150, priceMax: 200, radius: 80, matches: 4, status: '进行中', statusType: 'success', date: '2026-08-01', quality: '含水率≤30%，无沙石杂质' },
      { no: 'DMD-2026-0603', category: '秸秆', weight: '200 吨', priceMin: 50, priceMax: 80, radius: 100, matches: 6, status: '进行中', statusType: 'success', date: '2026-08-03', quality: '含水率低，颗粒均匀' },
      { no: 'DMD-2026-0606', category: '牛粪', weight: '100 吨', priceMin: 110, priceMax: 150, radius: 120, matches: 5, status: '进行中', statusType: 'success', date: '2026-08-05', quality: '完全腐熟，无病原菌' },
      { no: 'DMD-2026-0608', category: '猪粪', weight: '70 吨', priceMin: 90, priceMax: 120, radius: 90, matches: 3, status: '进行中', statusType: 'success', date: '2026-07-28', quality: '固液分离，重金属达标' },
      // 待审核（3）
      { no: 'DMD-2026-0602', category: '牛粪', weight: '80 吨', priceMin: 100, priceMax: 140, radius: 120, matches: 0, status: '待审核', statusType: 'warning', date: '2026-08-06', quality: '完全腐熟，无病原菌' },
      { no: 'DMD-2026-0605', category: '猪粪', weight: '60 吨', priceMin: 90, priceMax: 130, radius: 90, matches: 1, status: '待审核', statusType: 'warning', date: '2026-08-10', quality: '固液分离，重金属达标' },
      { no: 'DMD-2026-0609', category: '羊粪', weight: '45 吨', priceMin: 130, priceMax: 170, radius: 70, matches: 0, status: '待审核', statusType: 'warning', date: '2026-07-30', quality: '有机质丰富，缓释肥效' },
      // 已完成（5）
      { no: 'DMD-2026-0604', category: '羊粪', weight: '40 吨', priceMin: 130, priceMax: 180, radius: 60, matches: 2, status: '已完成', statusType: 'neutral', date: '2026-08-08', quality: '有机质丰富，缓释肥效' },
      { no: 'DMD-2026-0607', category: '鸡粪', weight: '55 吨', priceMin: 140, priceMax: 190, radius: 80, matches: 3, status: '已完成', statusType: 'neutral', date: '2026-07-20', quality: '含水率≤30%，无沙石杂质' },
      { no: 'DMD-2026-0610', category: '玉米芯', weight: '120 吨', priceMin: 80, priceMax: 110, radius: 100, matches: 2, status: '已完成', statusType: 'neutral', date: '2026-07-15', quality: '吸水性强，颗粒均匀' },
      { no: 'DMD-2026-0611', category: '花生壳', weight: '30 吨', priceMin: 120, priceMax: 150, radius: 60, matches: 1, status: '已完成', statusType: 'neutral', date: '2026-07-10', quality: '木质素适中，易发酵' },
      { no: 'DMD-2026-0612', category: '稻壳', weight: '35 吨', priceMin: 200, priceMax: 240, radius: 50, matches: 1, status: '已完成', statusType: 'neutral', date: '2026-07-05', quality: '孔隙发达，透气保水' }
    ];

    var purchaseFilter = 'all';
    var purchaseFilters = [
      { key: 'all', label: '全部' },
      { key: 'success', label: '进行中' },
      { key: 'warning', label: '待审核' },
      { key: 'neutral', label: '已完成' }
    ];

    function purchaseStatusBadge(t) {
      var map = {
        success: 'background:var(--th-state-success-surface); color:var(--th-state-success);',
        warning: 'background:var(--th-state-warning-surface); color:var(--th-state-warning);',
        neutral: 'background:var(--th-secondary); color:var(--th-secondary-foreground);'
      };
      return '<span style="display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--th-radius-full); font-size:var(--th-font-size-xs); font-weight:600; white-space:nowrap;' + (map[t] || map.neutral) + '"><span style="width:6px;height:6px;border-radius:var(--th-radius-full);background:currentColor;"></span>' + (t === 'success' ? '进行中' : t === 'warning' ? '待审核' : '已完成') + '</span>';
    }

    function purchaseFilterTabsHtml() {
      return purchaseFilters.map(function (f) {
        var active = f.key === purchaseFilter;
        return '<button data-pf="' + f.key + '" style="padding:7px 16px;border-radius:var(--th-radius-full);border:1px solid ' + (active ? 'var(--th-primary)' : 'var(--th-border)') + ';background:' + (active ? 'var(--th-primary)' : 'var(--th-card)') + ';color:' + (active ? 'var(--th-primary-foreground)' : 'var(--th-secondary-foreground)') + ';font-size:var(--th-font-size-sm);font-weight:500;cursor:pointer;white-space:nowrap;">' + f.label + '</button>';
      }).join('');
    }

    function purchaseView() {
      var list = purchaseFilter === 'all' ? purchaseList : purchaseList.filter(function (p) { return p.statusType === purchaseFilter; });
      var rows = list.map(function (p) {
        // 已完成仅查看；进行中/待审核：查看 + 编辑(选匹配地) + 撤销
        var ops = '<button data-pa="view" data-no="' + p.no + '" style="display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--th-radius-sm);border:1px solid var(--th-border);background:var(--th-card);color:var(--th-secondary-foreground);font-size:var(--th-font-size-xs);cursor:pointer;"><i data-lucide="eye" style="width:13px;height:13px;"></i>查看</button>';
        if (p.statusType === 'success' || p.statusType === 'warning') {
          ops += '<button data-pa="edit" data-no="' + p.no + '" style="display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--th-radius-sm);border:1px solid var(--th-border);background:var(--th-card);color:var(--th-secondary-foreground);font-size:var(--th-font-size-xs);cursor:pointer;"><i data-lucide="pencil" style="width:13px;height:13px;"></i>编辑</button>';
          ops += '<button data-pa="revoke" data-no="' + p.no + '" style="display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--th-radius-sm);border:none;background:var(--th-state-error-surface);color:var(--th-state-error);font-size:var(--th-font-size-xs);cursor:pointer;"><i data-lucide="trash-2" style="width:13px;height:13px;"></i>撤销</button>';
        }
        return '<tr style="border-bottom:1px solid var(--th-border);">' +
          '<td style="padding:14px 16px;white-space:nowrap;font-family:var(--th-font-mono);font-size:var(--th-font-size-xs);color:var(--th-muted-foreground);">' + p.no + '</td>' +
          '<td style="padding:14px 16px;white-space:nowrap;font-weight:500;">' + p.category + '</td>' +
          '<td style="padding:14px 16px;white-space:nowrap;">' + p.weight + '</td>' +
          '<td style="padding:14px 16px;white-space:nowrap;">¥' + p.priceMin + ' - ' + p.priceMax + ' <span style="color:var(--th-muted-foreground);font-size:var(--th-font-size-xs);">/吨</span></td>' +
          '<td style="padding:14px 16px;white-space:nowrap;">' + p.radius + ' km</td>' +
          '<td style="padding:14px 16px;white-space:nowrap;">' + (p.matches > 0 ? '<span style="display:inline-flex;align-items:center;gap:4px;color:var(--th-state-info);font-weight:600;"><i data-lucide="sparkles" style="width:14px;height:14px;"></i>' + p.matches + ' 个匹配</span>' : '<span style="color:var(--th-muted-foreground);">—</span>') + '</td>' +
          '<td style="padding:14px 16px;white-space:nowrap;">' + purchaseStatusBadge(p.statusType) + '</td>' +
          '<td style="padding:14px 16px;white-space:nowrap;color:var(--th-muted-foreground);">' + p.date + '</td>' +
          '<td style="padding:14px 16px;white-space:nowrap;"><div style="display:flex;align-items:center;gap:4px;">' + ops + '</div></td></tr>';
      }).join('');

      var statVals = purchaseStatValues();
      var statCards = purchaseStats.map(function (s, i) {
        return '<div style="border:1px solid var(--th-border);border-radius:var(--th-radius);background:var(--th-card);padding:18px 20px;box-shadow:var(--th-shadow-xs);min-width:0;display:flex;align-items:center;gap:14px;">' +
          '<span style="width:44px;height:44px;border-radius:var(--th-radius);background:color-mix(in srgb,' + s.color + ' 10%,transparent);color:' + s.color + ';display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i data-lucide="' + s.icon + '" style="width:22px;height:22px;"></i></span>' +
          '<div style="min-width:0;"><p style="margin:0;font-size:var(--th-font-size-sm);color:var(--th-muted-foreground);white-space:nowrap;">' + s.label + '</p>' +
          '<p style="margin:2px 0 0 0;font-size:var(--th-font-size-h3);font-weight:700;color:var(--th-foreground);line-height:1.2;white-space:nowrap;">' + statVals[i] + '</p>' +

              '<div><label style="display:block;font-size:var(--th-font-size-sm);font-weight:500;color:var(--th-foreground);margin-bottom:6px;">预期单价（最低）<span style="color:var(--th-state-error);">*</span></label>' +
                '<div style="display:flex;align-items:center;gap:8px;"><input id="pf-price-min" type="number" min="0" step="1" placeholder="如 150" style="' + inputCls + '"><span class="th-body-sm" style="color:var(--th-muted-foreground);flex-shrink:0;">¥/吨</span></div></div>' +

                '<div style="display:flex;align-items:center;gap:8px;"><input id="pf-price-max" type="number" min="0" step="1" placeholder="如 200" style="' + inputCls + '"><span class="th-body-sm" style="color:var(--th-muted-foreground);flex-shrink:0;">¥/吨</span></div></div>' +

                '<div style="display:flex;align-items:center;gap:8px;"><input id="pf-radius" type="number" min="1" step="1" placeholder="如 80" style="' + inputCls + '"><span class="th-body-sm" style="color:var(--th-muted-foreground);flex-shrink:0;">km</span></div></div>' +

              '<div class="sm:col-span-2"><label style="display:block;font-size:var(--th-font-size-sm);font-weight:500;color:var(--th-foreground);margin-bottom:6px;">状态</label>' +

              '<button type="button" id="purchase-modal-cancel" style="padding:9px 18px;border-radius:var(--th-radius-full);border:1px solid var(--th-border);background:var(--th-card);color:var(--th-secondary-foreground);font-size:var(--th-font-size-sm);font-weight:500;cursor:pointer;">取消</button>' +

    function openPurchaseModal() {
      var m = document.getElementById('purchase-modal');
      if (!m) return;
      m.style.display = 'flex';
      TH.refreshIcons();
    }

    function closePurchaseModal() {
      var m = document.getElementById('purchase-modal');
      if (m) m.style.display = 'none';
    }

    function submitPurchase() {
      var category = document.getElementById('pf-category').value;
      var weight = parseFloat(document.getElementById('pf-weight').value);
      var priceMin = parseFloat(document.getElementById('pf-price-min').value);
      var priceMax = parseFloat(document.getElementById('pf-price-max').value);
      var radius = parseFloat(document.getElementById('pf-radius').value);
      var matchType = document.getElementById('pf-match').value;
      var err = [];
      if (!category) err.push('请选择品类');
      if (!(weight > 0)) err.push('请填写目标重量');
      if (!(priceMin >= 0)) err.push('请填写最低单价');
      if (!(priceMax >= 0)) err.push('请填写最高单价');
      if (priceMax < priceMin) err.push('最高单价不能低于最低单价');
      if (!(radius > 0)) err.push('请填写采购半径');
      if (err.length) { TH.toast(err[0], 'error'); return; }

      var now = new Date();
      var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
      var seq = 601 + purchaseList.length;
      var no = 'DMD-' + now.getFullYear() + '-' + pad(Math.min(seq, 9999));
      var item = {
        no: no,
        category: category,
        weight: weight + ' 吨',
        priceMin: priceMin,
        priceMax: priceMax,
        radius: radius,
        matches: 0,
        matchType: matchType,
        status: '待审核',
        statusType: 'warning',
        date: now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()),
        quality: '—'
      };
      purchaseList.unshift(item);
      purchaseFilter = 'warning';
      closePurchaseModal();
      document.getElementById('page-content').innerHTML = purchaseView();
      TH.refreshIcons();
      bindPurchaseEvents();
      TH.toast('需求 ' + no + ' 已提交，进入待审核', 'success');
    }

    function showPurchase() {
      document.getElementById('page-content').innerHTML = purchaseView();
      TH.refreshIcons();
      bindPurchaseEvents();
    }

    function bindPurchaseEvents() {
      document.getElementById('purchase-tabs').addEventListener('click', function (e) {
        var b = e.target.closest('[data-pf]');
        if (!b) return;
        purchaseFilter = b.getAttribute('data-pf');
        document.getElementById('page-content').innerHTML = purchaseView();
        TH.refreshIcons();
        bindPurchaseEvents();
      });
      document.getElementById('purchase-search').addEventListener('input', function () {
        // 演示：搜索交互
      });
      document.getElementById('purchase-new').addEventListener('click', openPurchaseModal);
      document.getElementById('purchase-modal-close').addEventListener('click', closePurchaseModal);
      document.getElementById('purchase-modal-cancel').addEventListener('click', closePurchaseModal);
      document.getElementById('purchase-modal').addEventListener('click', function (e) { if (e.target === this) closePurchaseModal(); });
      document.getElementById('purchase-form').addEventListener('submit', function (e) { e.preventDefault(); submitPurchase(); });
      document.addEventListener('click', function (e) {
        var act = e.target.closest('[data-pa]');
        if (!act) return;
        var no = act.getAttribute('data-no');
        var type = act.getAttribute('data-pa');
        var p = purchaseList.find(function (x) { return x.no === no; });
        if (!p) return;
        if (type === 'view') { openPurchaseDetail(no); }
        if (type === 'edit') { openPurchaseEdit(no); }
        if (type === 'revoke') {
          thConfirm('撤销采购需求', '确认撤销需求「' + no + ' · ' + p.category + '」吗？撤销后该需求将从列表隐藏。', '确认撤销', function () {
            purchaseList = purchaseList.filter(function (x) { return x.no !== no; });
            document.getElementById('page-content').innerHTML = purchaseView();
            TH.refreshIcons();
            bindPurchaseEvents();
            TH.toast('需求 ' + no + ' 已撤销', 'success');
          });
        }
      });
    }

      return [
        { id: 'c1', supplier: '绿色农场', location: '河北邢台', distance: 42, price: p.priceMin + 10, score: 96 },
        { id: 'c2', supplier: '鲁西牧业', location: '山东济南', distance: 78, price: p.priceMin + 20, score: 92 },
        { id: 'c3', supplier: '周口农合社', location: '河南周口', distance: 65, price: p.priceMin + 5, score: 90 },
        { id: 'c4', supplier: '川西养殖联合体', location: '四川成都', distance: 120, price: p.priceMin - 5, score: 85 }

      wrap.innerHTML = '<div style="width:min(580px,100%);background:var(--th-card);border:1px solid var(--th-border);border-radius:var(--th-radius);box-shadow:var(--th-shadow-2xl);padding:24px;max-height:82vh;overflow-y:auto;">' +

          '<h3 style="margin:0;font-size:var(--th-font-size-h3);font-weight:600;color:var(--th-foreground);">' + title + '</h3>' +
          '<button type="button" data-pmclose style="background:var(--th-secondary);border:none;width:32px;height:32px;border-radius:var(--th-radius-full);cursor:pointer;color:var(--th-muted-foreground);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;"><i data-lucide="x" style="width:16px;height:16px;"></i></button>' +

    function openPurchaseDetail(no) {

      TH.refreshIcons();
      bindDispatchEvents();

    function openProductModal() {
      var m = document.getElementById('product-modal');
      if (!m) return;
      m.style.display = 'flex';
      TH.refreshIcons();
    }

    function closeProductModal() {
      var m = document.getElementById('product-modal');
      if (m) m.style.display = 'none';
    }

    function submitProductModal() {
      var checked = productList.filter(function (p) {
        var cb = document.querySelector('[data-pcheck="' + p.code + '"]');
        return cb && cb.checked;
      });
      if (!checked.length) { TH.toast('请至少勾选一个商品', 'error'); return; }
      var names = [];
      checked.forEach(function (p) {
        var qtyEl = document.querySelector('[data-pqty="' + p.code + '"]');
        var priceEl = document.querySelector('[data-pprice="' + p.code + '"]');
        var qty = parseInt(qtyEl.value, 10);
        var price = parseFloat(priceEl.value);
        if (qty > 0) p.stock = qty;
        if (price >= 0) p.price = price;
        p.statusType = 'warning'; // 上架进入待审核
        p.date = new Date().getFullYear() + '-' + (new Date().getMonth() + 1 < 10 ? '0' : '') + (new Date().getMonth() + 1) + '-' + (new Date().getDate() < 10 ? '0' : '') + new Date().getDate();
        names.push(p.name);
      });
      closeProductModal();
      productFilter = 'all';
      document.getElementById('page-content').innerHTML = productView();
      TH.refreshIcons();
      bindProductEvents();
      TH.toast('已上架 ' + checked.length + ' 件商品（进入待审核）：' + names.join('、'), 'success');
    }
    function showProducts() {
      document.getElementById('page-content').innerHTML = productView();
      TH.refreshIcons();
      bindProductEvents();
    }
    function bindProductEvents() {
      document.getElementById('product-tabs').addEventListener('click', function (e) {
        var b = e.target.closest('[data-pf2]');
        if (!b) return;
        productFilter = b.getAttribute('data-pf2');
        document.getElementById('page-content').innerHTML = productView();
        TH.refreshIcons();
        bindProductEvents();
      });
      document.getElementById('product-search').addEventListener('input', function () {});
      document.getElementById('product-new').addEventListener('click', openProductModal);
      document.getElementById('product-modal-close').addEventListener('click', closeProductModal);
      document.getElementById('product-modal-cancel').addEventListener('click', closeProductModal);
      document.getElementById('product-modal').addEventListener('click', function (e) { if (e.target === this) closeProductModal(); });
      document.getElementById('product-modal-confirm').addEventListener('click', submitProductModal);

        if (e.target.matches('[data-pcheck]')) {

    function fillBellPanel() {
      var waiting = purchaseList.filter(function (x) { return x.statusType === 'warning'; }).length;

      lst.innerHTML = items.map(function (it) {
        return '<div style="padding:12px 16px;border-bottom:1px solid var(--th-border);display:flex;align-items:center;gap:12px;">' +
          '<span style="width:32px;height:32px;border-radius:var(--th-radius);background:color-mix(in srgb,' + it.color + ' 10%,transparent);color:' + it.color + ';display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i data-lucide="' + it.icon + '" style="width:16px;height:16px;"></i></span>' +
          '<div style="flex:1;min-width:0;"><p style="margin:0;font-size:var(--th-font-size-sm);font-weight:500;color:var(--th-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + it.title + '</p>' +
          '<p class="th-body-sm" style="margin:1px 0 0 0;color:var(--th-muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + it.desc + '</p></div>' +
          '<a href="#" data-todo="' + it.title + '" style="flex-shrink:0;font-size:var(--th-font-size-sm);color:var(--th-primary);text-decoration:none;font-weight:500;white-space:nowrap;">去处理</a></div>';
      }).join('');
    }
    function toggleBellPanel() {
      var p = document.getElementById('bell-panel');
      if (!p) return;
      if (p.style.display === 'block') { p.style.display = 'none'; return; }
      fillBellPanel();
      p.style.display = 'block';
      TH.refreshIcons();
    }

    document.addEventListener('click', function (e) {
      var bp = document.getElementById('bell-panel');
      var bb = document.getElementById('bell');
      if (bp && bp.style.display === 'block' && !bp.contains(e.target) && !(bb && bb.contains(e.target))) bp.style.display = 'none';
      var todo = e.target.closest('[data-todo]');
      if (todo) {
        e.preventDefault();
        var todoLabel = todo.getAttribute('data-todo');
        closeBellPanel();
        // 去处理 → 跳转对应模块视图
        if (todoLabel === '待匹配需求') { activeNav = 'purchase'; renderNav(); showPurchase(); }
        else if (todoLabel === '待派单任务') { activeNav = 'dispatch'; renderNav(); showDispatch(); }
        else if (todoLabel === '待结算订单') { activeNav = 'orders'; renderNav(); showOrders(); }
        else { TH.toast('正在处理「' + todoLabel + '」（演示）', 'info'); }
      }
      var ql = e.target.closest('.quick-link');
      if (ql) {
        e.preventDefault();
        var qlLabel = ql.textContent.trim();
        // 发布需求 → 打开采购需求的新建需求模态框（与采购需求页"新建需求"一致）
        if (qlLabel.indexOf('发布需求') !== -1) {
          activeNav = 'purchase';
          renderNav();
          showPurchase();
          openPurchaseModal();
        } else {
          TH.toast('「' + qlLabel + '」模块为演示', 'info');
        }
      }
    });

    dashboardHtml = document.getElementById('page-content').innerHTML;
    renderNav();
    renderDashboard();
    TH.refreshIcons();
  </script>

  <style>
    .kpi-card, .todo-card, .quick-link { transition: box-shadow var(--th-duration-fast) var(--th-ease), transform var(--th-duration-fast) var(--th-ease); }
    .kpi-card:hover, .todo-card:hover, .quick-link:hover { box-shadow: var(--th-shadow-md); }
    .quick-link:hover { transform: translateY(-1px); }
    tbody tr { transition: background var(--th-duration-fast) var(--th-ease); }
    tbody tr:hover { background: color-mix(in srgb, var(--th-secondary) 60%, transparent); }
    #sidebar-drawer .th-drawer-panel { left: 0; right: auto; transform: translateX(-100%); }
    #sidebar-drawer.th-drawer-open .th-drawer-panel { transform: translateX(0); }
  </style>
</body>
</html>
