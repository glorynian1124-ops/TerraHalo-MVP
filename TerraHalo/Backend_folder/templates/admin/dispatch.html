{% extends "base.html" %}
{% block title %}调度中心 - 沃土之环{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <h2 class="mb-4"><i class="fas fa-calendar-check"></i> 调度中心</h2>

    <div class="row">
        <!-- 左侧：待派单任务池 -->
        <div class="col-md-7">
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0"><i class="fas fa-clipboard-list"></i> 待派单任务池</h5>
                </div>
                <div class="card-body" style="max-height:70vh;overflow-y:auto;">
                    <div id="taskPool"><p class="text-center text-muted py-4">加载中...</p></div>
                </div>
            </div>
        </div>

        <!-- 右侧：司机列表 -->
        <div class="col-md-5">
            <div class="card">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0"><i class="fas fa-users"></i> 可用司机</h5>
                </div>
                <div class="card-body" style="max-height:70vh;overflow-y:auto;">
                    <div id="driverList"><p class="text-center text-muted py-4">加载中...</p></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let selectedTaskId = null;
let selectedDriverId = null;

function loadTaskPool() {
    fetch('/admin/api/dispatch/pending-tasks')
        .then(r => r.json())
        .then(data => {
            if (!data.length) {
                document.getElementById('taskPool').innerHTML =
                    '<div class="alert alert-success text-center">暂无待派单任务</div>';
                return;
            }
            let html = '';
            data.forEach(t => {
                const s = t.supply || {};
                html += `
                <div class="card mb-2 ${selectedTaskId===t.id?'border-primary border-2':''}" 
                     onclick="selectTask(${t.id})" style="cursor:pointer">
                    <div class="card-body py-2">
                        <div class="d-flex justify-content-between">
                            <div>
                                <strong>${t.task_no}</strong>
                                <span class="badge bg-secondary ms-2">${t.demand_category||'-'}</span>
                            </div>
                            <small>${t.created_at?t.created_at.substr(0,10):''}</small>
                        </div>
                        <small class="text-muted">提: ${t.pickup_address} → 达: ${t.delivery_address}</small>
                    </div>
                </div>`;
            });
            document.getElementById('taskPool').innerHTML = html;
        });
}

function loadDrivers() {
    fetch('/admin/api/dispatch/drivers')
        .then(r => r.json())
        .then(data => {
            if (!data.length) {
                document.getElementById('driverList').innerHTML =
                    '<div class="alert alert-warning text-center">暂无可用司机</div>';
                return;
            }
            let html = '';
            data.forEach(d => {
                html += `
                <div class="card mb-2 ${selectedDriverId===d.id?'border-success border-2':''}"
                     onclick="selectDriver(${d.id})" style="cursor:pointer">
                    <div class="card-body py-2">
                        <div class="d-flex justify-content-between">
                            <strong>${d.name}</strong>
                            <small class="text-muted">${d.active_tasks}单进行中</small>
                        </div>
                        <small>${d.vehicle_type} | ${d.vehicle_no} | ${d.vehicle_capacity_ton}吨</small>
                    </div>
                </div>`;
            });
            document.getElementById('driverList').innerHTML = html;
        });
}

function selectTask(id) {
    selectedTaskId = id;
    loadTaskPool();
    checkAssign();
}

function selectDriver(id) {
    selectedDriverId = id;
    loadDrivers();
    checkAssign();
}

function checkAssign() {
    if (selectedTaskId && selectedDriverId) {
        if (confirm(`确认将任务派给该司机？`)) {
            fetch('/admin/api/dispatch/assign', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({task_id:selectedTaskId, driver_id:selectedDriverId})
            }).then(r=>r.json()).then(d=>{
                if(d.message) {
                    alert('派单成功！');
                    selectedTaskId = null;
                    selectedDriverId = null;
                    loadTaskPool();
                    loadDrivers();
                } else alert(d.error);
            });
        }
    }
}

loadTaskPool();
loadDrivers();
</script>
{% endblock %}
