<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraHalo - 登录注册</title>
    <style id="theme-vars">
/* ===== TerraHalo Brand CSS ===== */
/* Apple-inspired typography + spacing system with brown/green earth palette */

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;700&display=swap');

/* ----- Primitive Palette ----- */
:root {
  /* Brown (earth) - brand primary */
  --th-brown-50: #fef9ed;
  --th-brown-100: #fdf3d6;
  --th-brown-200: #fae5a4;
  --th-brown-300: #f5d06a;
  --th-brown-400: #e8b830;
  --th-brown-500: #8B6914;
  --th-brown-600: #7a5c11;
  --th-brown-700: #6B4F10;
  --th-brown-800: #5a3f0a;
  --th-brown-900: #3d2807;

  /* Green (crop) - accent / state success */
  --th-green-50: #eef5ec;
  --th-green-100: #d9ebd5;
  --th-green-200: #b5d6ab;
  --th-green-300: #8abd79;
  --th-green-400: #5f9a4a;
  --th-green-500: #2D5A27;
  --th-green-600: #264e21;
  --th-green-700: #1B3D18;
  --th-green-800: #143012;
  --th-green-900: #0d200c;

  /* Background - warm earth */
  --th-background-50: #ffffff;
  --th-background-100: #faf8f2;
  --th-background-200: #f5f1e7;
  --th-background-300: #ede6d5;
  --th-background-400: #ddd2ba;
  --th-background-500: #b8ac94;
  --th-background-600: #8c8070;
  --th-background-700: #5c5448;
  --th-background-800: #2b2416;
  --th-background-900: #1c1814;

  /* Text */
  --th-text-50: #f5f3ef;
  --th-text-100: #e5e0d8;
  --th-text-200: #c4bcae;
  --th-text-300: #a39887;
  --th-text-400: #8c8070;
  --th-text-500: #6e6456;
  --th-text-600: #5c5448;
  --th-text-700: #3d362e;
  --th-text-800: #2b2416;
  --th-text-900: #1c1814;

  /* State colors */
  --th-state-success: #2D5A27;
  --th-state-success-surface: #eef5ec;
  --th-state-warning: #d97706;
  --th-state-warning-surface: #fffbeb;
  --th-state-error: #dc2626;
  --th-state-error-surface: #fef2f2;
  --th-state-info: #2563eb;
  --th-state-info-surface: #eff6ff;

  /* ----- Semantic Roles ----- */
  --th-background: var(--th-background-100);
  --th-foreground: var(--th-text-800);
  --th-primary: var(--th-brown-500);
  --th-primary-foreground: #ffffff;
  --th-secondary: var(--th-background-200);
  --th-secondary-foreground: var(--th-text-700);
  --th-muted: var(--th-background-200);
  --th-muted-foreground: var(--th-text-500);
  --th-accent: var(--th-green-500);
  --th-accent-foreground: #ffffff;
  --th-card: var(--th-background-50);
  --th-card-foreground: var(--th-text-800);
  --th-border: var(--th-background-300);
  --th-input: var(--th-background-400);
  --th-ring: var(--th-brown-500);

  /* ----- Typography ----- */
  --th-font-sans: 'DM Sans', ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif;
  --th-font-mono: 'JetBrains Mono', monospace;
  --th-font-size-hero: clamp(3rem, 6vw, 5rem);
  --th-font-size-h1: clamp(2rem, 4vw, 3rem);
  --th-font-size-h2: clamp(1.5rem, 3vw, 2.25rem);
  --th-font-size-h3: 1.25rem;
  --th-font-size-body: 1rem;
  --th-font-size-sm: 0.875rem;
  --th-font-size-xs: 0.75rem;
  --th-font-size-eyebrow: 0.6875rem;
  --th-line-height-tight: 0.92;
  --th-line-height-snug: 1.15;
  --th-line-height-body: 1.55;
  --th-letter-spacing-hero: -0.04em;
  --th-letter-spacing-eyebrow: 0.08em;

  /* ----- Spacing ----- */
  --th-spacing: 0.24rem;

  /* ----- Radius ----- */
  --th-radius: 1.2rem;
  --th-radius-sm: 0.5rem;
  --th-radius-full: 9999px;

  /* ----- Shadow (whisper-light) ----- */
  --th-shadow-xs: 0 1px 2px 0 rgba(0,0,0,0.04);
  --th-shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05), 0 1px 3px -1px rgba(0,0,0,0.05);
  --th-shadow: 0 2px 4px -1px rgba(0,0,0,0.06), 0 1px 2px -1px rgba(0,0,0,0.05);
  --th-shadow-md: 0 4px 8px -2px rgba(0,0,0,0.06), 0 2px 4px -2px rgba(0,0,0,0.05);
  --th-shadow-lg: 0 8px 24px -8px rgba(0,0,0,0.08), 0 4px 8px -4px rgba(0,0,0,0.05);
  --th-shadow-xl: 0 16px 40px -10px rgba(0,0,0,0.10), 0 8px 16px -8px rgba(0,0,0,0.06);
  --th-shadow-2xl: 0 24px 64px -12px rgba(0,0,0,0.12);

  /* ----- Hero Gradient ----- */
  --th-hero-gradient: linear-gradient(135deg, var(--th-brown-700) 0%, var(--th-green-500) 60%, var(--th-green-700) 100%);

  /* ----- Motion ----- */
  --th-ease: cubic-bezier(0.32, 0.72, 0, 1);
  --th-duration-fast: 150ms;
  --th-duration-base: 250ms;
  --th-duration-slow: 350ms;
}

/* ----- Typography Utility Classes ----- */
.th-h1 { font-family: var(--th-font-sans); font-size: var(--th-font-size-h1); font-weight: 600; line-height: var(--th-line-height-tight); letter-spacing: -0.03em; color: var(--th-foreground); }
.th-h2 { font-family: var(--th-font-sans); font-size: var(--th-font-size-h2); font-weight: 600; line-height: var(--th-line-height-snug); letter-spacing: -0.02em; color: var(--th-foreground); }
.th-h3 { font-family: var(--th-font-sans); font-size: var(--th-font-size-h3); font-weight: 600; line-height: var(--th-line-height-snug); color: var(--th-foreground); }
.th-body { font-family: var(--th-font-sans); font-size: var(--th-font-size-body); font-weight: 400; line-height: var(--th-line-height-body); color: var(--th-foreground); }
.th-body-sm { font-family: var(--th-font-sans); font-size: var(--th-font-size-sm); font-weight: 400; line-height: var(--th-line-height-body); color: var(--th-muted-foreground); }
.th-eyebrow { font-family: var(--th-font-sans); font-size: var(--th-font-size-eyebrow); font-weight: 700; line-height: 1; letter-spacing: var(--th-letter-spacing-eyebrow); text-transform: uppercase; color: var(--th-muted-foreground); }
.th-mono { font-family: var(--th-font-mono); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--th-background);
    --color-foreground: var(--th-foreground);
    --color-card: var(--th-card);
    --color-card-foreground: var(--th-card-foreground);
    --color-primary: var(--th-primary);
    --color-primary-foreground: var(--th-primary-foreground);
    --color-secondary: var(--th-secondary);
    --color-secondary-foreground: var(--th-secondary-foreground);
    --color-muted: var(--th-muted);
    --color-muted-foreground: var(--th-muted-foreground);
    --color-accent: var(--th-accent);
    --color-accent-foreground: var(--th-accent-foreground);
    --color-border: var(--th-border);
    --color-input: var(--th-input);
    --color-ring: var(--th-ring);
  }
  @layer base {
    body { background: var(--th-background); color: var(--th-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen flex flex-col" style="background-color: var(--th-background); font-family: var(--th-font-sans); color: var(--th-foreground);">

  <!-- Navigation Bar -->
  <nav class="w-full relative z-10" style="background-color: var(--th-background); border-bottom: 1px solid var(--th-border);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="#" class="flex items-center gap-2.5 no-underline shrink-0">
          <span class="text-2xl leading-none select-none" role="img" aria-label="沃土之环">🌱</span>
          <span class="font-semibold text-lg" style="font-family: var(--th-font-sans); color: var(--th-foreground);">沃土之环</span>
        </a>
        <div class="hidden md:flex items-center gap-8">
          <a href="#" data-dom-id="nav-home" class="th-body-sm no-underline transition-opacity hover:opacity-70" style="color: var(--th-muted-foreground);">首页</a>
          <a href="#" data-dom-id="nav-market" class="th-body-sm no-underline transition-opacity hover:opacity-70" style="color: var(--th-muted-foreground);">原料市场</a>
          <a href="#" data-dom-id="nav-fertilizer" class="th-body-sm no-underline transition-opacity hover:opacity-70" style="color: var(--th-muted-foreground);">有机肥商城</a>
        </div>
        <a href="#" data-dom-id="cta-back-home" class="hidden md:inline-flex items-center justify-center whitespace-nowrap no-underline font-semibold text-sm transition-all hover:opacity-90 active:scale-[0.98]" style="padding: 0.5rem 1.5rem; border-radius: var(--th-radius-full); background-color: var(--th-primary); color: var(--th-primary-foreground);">返回首页</a>
        <button class="md:hidden inline-flex items-center justify-center w-10 h-10" style="color: var(--th-foreground); background: transparent; border: none; cursor: pointer; border-radius: var(--th-radius-sm);" aria-label="菜单">
          <i data-lucide="menu" style="width: 20px; height: 20px;"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content - Split Layout -->
  <main class="flex-1 flex flex-col md:flex-row">
    <!-- Left: Brand Panel -->
    <div class="w-full md:w-[45%] lg:w-[42%] flex items-center justify-center px-8 py-12 md:py-0" style="background: linear-gradient(160deg, var(--th-brown-100) 0%, var(--th-background-200) 40%, var(--th-green-100) 100%);">
      <div class="text-center max-w-sm">
        <span class="text-6xl md:text-7xl leading-none block mb-6 select-none" role="img" aria-label="沃土之环">🌱</span>
        <h1 class="th-h1 mb-4" style="text-wrap: balance; word-break: keep-all; overflow-wrap: break-word; margin-top: 0;">沃土之环</h1>
        <p class="th-body" style="color: var(--th-muted-foreground); max-width: 280px; margin-left: auto; margin-right: auto;">绿色农业 · 循环经济</p>
        <div class="mt-10 hidden md:block" style="width: 48px; height: 1px; background-color: var(--th-border); margin-left: auto; margin-right: auto;"></div>
        <p class="th-body-sm mt-6 hidden md:block" style="color: var(--th-text-400); max-width: 260px; margin-left: auto; margin-right: auto;">连接农田与工厂，让每一份废弃物都重获新生</p>
      </div>
    </div>

    <!-- Right: Form Panel -->
    <div class="w-full md:w-[55%] lg:w-[58%] flex items-center justify-center px-4 sm:px-8 py-8 md:py-0">
      <div class="w-full max-w-md">
        <!-- Form Card -->
        <div class="w-full p-6 sm:p-8" style="background-color: var(--th-card); border: 1px solid var(--th-border); border-radius: var(--th-radius);">
          <!-- Tab Switcher -->
          <div class="flex mb-8" style="border-bottom: 1px solid var(--th-border);">
            <button id="tab-login" class="flex-1 flex items-center justify-center whitespace-nowrap font-semibold text-base pb-3 transition-colors border-b-2" style="border-color: var(--th-primary); color: var(--th-foreground); background: transparent; cursor: pointer; transition-duration: var(--th-duration-fast);" onclick="switchTab('login')">登录</button>
            <button id="tab-register" class="flex-1 flex items-center justify-center whitespace-nowrap font-semibold text-base pb-3 transition-colors border-b-2" style="border-color: transparent; color: var(--th-muted-foreground); background: transparent; cursor: pointer; transition-duration: var(--th-duration-fast);" onclick="switchTab('register')">注册</button>
          </div>

          <!-- Login Form -->
          <form id="form-login" class="flex flex-col gap-5" onsubmit="return false;">
            <div class="flex flex-col gap-1.5">
              <label class="th-body-sm font-medium" style="color: var(--th-foreground);">用户名</label>
              <div class="relative">
                <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2" style="width: 18px; height: 18px; color: var(--th-muted-foreground); pointer-events: none;"></i>
                <input type="text" placeholder="请输入用户名" class="w-full th-body outline-none transition-all pl-10 pr-4 form-input-focus" style="height: 44px; border: 1px solid var(--th-input); border-radius: var(--th-radius); background-color: var(--th-background); color: var(--th-foreground); font-family: var(--th-font-sans); transition-duration: var(--th-duration-fast);">
              </div>
            </div>
            <div class="flex flex-col gap-1.5">
              <label class="th-body-sm font-medium" style="color: var(--th-foreground);">密码</label>
              <div class="relative">
                <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2" style="width: 18px; height: 18px; color: var(--th-muted-foreground); pointer-events: none;"></i>
                <input type="password" placeholder="请输入密码" class="w-full th-body outline-none transition-all pl-10 pr-4 form-input-focus" style="height: 44px; border: 1px solid var(--th-input); border-radius: var(--th-radius); background-color: var(--th-background); color: var(--th-foreground); font-family: var(--th-font-sans); transition-duration: var(--th-duration-fast);">
              </div>
            </div>
            <div class="flex items-center justify-between mt-1">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="w-4 h-4 rounded" style="accent-color: var(--th-primary);">
                <span class="th-body-sm" style="color: var(--th-muted-foreground);">记住我</span>
              </label>
              <a href="#" class="th-body-sm no-underline hover:underline" style="color: var(--th-primary); transition-duration: var(--th-duration-fast);">忘记密码？</a>
            </div>
            <button type="submit" data-dom-id="cta-login-submit" class="w-full flex items-center justify-center whitespace-nowrap font-semibold text-base border-none cursor-pointer transition-all mt-2 hover:opacity-90 active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-2" style="height: 48px; padding: 0 1.5rem; border-radius: var(--th-radius-full); background-color: var(--th-primary); color: var(--th-primary-foreground); outline-color: var(--th-ring); transition-duration: var(--th-duration-fast);">登录</button>
          </form>

          <!-- Register Form (hidden by default) -->
          <form id="form-register" class="hidden flex-col gap-5" onsubmit="return false;">
            <div class="flex flex-col gap-1.5">
              <label class="th-body-sm font-medium" style="color: var(--th-foreground);">角色</label>
              <div class="flex gap-2">
                <button type="button" class="role-pill role-active flex-1 flex items-center justify-center whitespace-nowrap font-medium text-sm border transition-all cursor-pointer" style="height: 36px; padding: 0 0.75rem; border-radius: var(--th-radius-full); background-color: var(--th-primary); color: var(--th-primary-foreground); border-color: var(--th-primary); transition-duration: var(--th-duration-fast);" data-role="farmer" onclick="selectRole(this)">农户</button>
                <button type="button" class="role-pill flex-1 flex items-center justify-center whitespace-nowrap font-medium text-sm border transition-all cursor-pointer" style="height: 36px; padding: 0 0.75rem; border-radius: var(--th-radius-full); background-color: transparent; color: var(--th-muted-foreground); border-color: var(--th-border); transition-duration: var(--th-duration-fast);" data-role="enterprise" onclick="selectRole(this)">企业</button>
                <button type="button" class="role-pill flex-1 flex items-center justify-center whitespace-nowrap font-medium text-sm border transition-all cursor-pointer" style="height: 36px; padding: 0 0.75rem; border-radius: var(--th-radius-full); background-color: transparent; color: var(--th-muted-foreground); border-color: var(--th-border); transition-duration: var(--th-duration-fast);" data-role="driver" onclick="selectRole(this)">司机</button>
              </div>
            </div>
            <div class="flex flex-col gap-1.5">
              <label class="th-body-sm font-medium" style="color: var(--th-foreground);">用户名</label>
              <div class="relative">
                <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2" style="width: 18px; height: 18px; color: var(--th-muted-foreground); pointer-events: none;"></i>
                <input type="text" placeholder="请输入用户名" class="w-full th-body outline-none transition-all pl-10 pr-4 form-input-focus" style="height: 44px; border: 1px solid var(--th-input); border-radius: var(--th-radius); background-color: var(--th-background); color: var(--th-foreground); font-family: var(--th-font-sans); transition-duration: var(--th-duration-fast);">
              </div>
            </div>
            <div class="flex flex-col gap-1.5">
              <label class="th-body-sm font-medium" style="color: var(--th-foreground);">手机号</label>
              <div class="relative">
                <i data-lucide="phone" class="absolute left-3 top-1/2 -translate-y-1/2" style="width: 18px; height: 18px; color: var(--th-muted-foreground); pointer-events: none;"></i>
                <input type="tel" placeholder="请输入手机号" class="w-full th-body outline-none transition-all pl-10 pr-4 form-input-focus" style="height: 44px; border: 1px solid var(--th-input); border-radius: var(--th-radius); background-color: var(--th-background); color: var(--th-foreground); font-family: var(--th-font-sans); transition-duration: var(--th-duration-fast);">
              </div>
            </div>
            <div class="flex flex-col gap-1.5">
              <label class="th-body-sm font-medium" style="color: var(--th-foreground);">密码</label>
              <div class="relative">
                <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2" style="width: 18px; height: 18px; color: var(--th-muted-foreground); pointer-events: none;"></i>
                <input type="password" placeholder="请输入密码" class="w-full th-body outline-none transition-all pl-10 pr-4 form-input-focus" style="height: 44px; border: 1px solid var(--th-input); border-radius: var(--th-radius); background-color: var(--th-background); color: var(--th-foreground); font-family: var(--th-font-sans); transition-duration: var(--th-duration-fast);">
              </div>
            </div>
            <div class="flex flex-col gap-1.5">
              <label class="th-body-sm font-medium" style="color: var(--th-foreground);">确认密码</label>
              <div class="relative">
                <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2" style="width: 18px; height: 18px; color: var(--th-muted-foreground); pointer-events: none;"></i>
                <input type="password" placeholder="请再次输入密码" class="w-full th-body outline-none transition-all pl-10 pr-4 form-input-focus" style="height: 44px; border: 1px solid var(--th-input); border-radius: var(--th-radius); background-color: var(--th-background); color: var(--th-foreground); font-family: var(--th-font-sans); transition-duration: var(--th-duration-fast);">
              </div>
            </div>
            <button type="submit" class="w-full flex items-center justify-center whitespace-nowrap font-semibold text-base border-none cursor-pointer transition-all mt-2 hover:opacity-90 active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-2" style="height: 48px; padding: 0 1.5rem; border-radius: var(--th-radius-full); background-color: var(--th-primary); color: var(--th-primary-foreground); outline-color: var(--th-ring); transition-duration: var(--th-duration-fast);">注册</button>
          </form>
        </div>

        <!-- Bottom agreement text -->
        <p class="th-body-sm text-center mt-6" style="color: var(--th-muted-foreground);">
          登录即表示同意 <a href="#" class="no-underline hover:underline" style="color: var(--th-primary); transition-duration: var(--th-duration-fast);">服务条款</a> 和 <a href="#" class="no-underline hover:underline" style="color: var(--th-primary); transition-duration: var(--th-duration-fast);">隐私政策</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full py-6" style="background-color: var(--th-background); border-top: 1px solid var(--th-border);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2">
          <span class="text-lg leading-none select-none" role="img" aria-label="沃土之环">🌱</span>
          <span class="th-body-sm" style="color: var(--th-muted-foreground);">沃土之环</span>
        </div>
        <div class="flex items-center gap-6">
          <a href="#" class="th-body-sm no-underline hover:underline" style="color: var(--th-muted-foreground); transition-duration: var(--th-duration-fast);">关于我们</a>
          <a href="#" class="th-body-sm no-underline hover:underline" style="color: var(--th-muted-foreground); transition-duration: var(--th-duration-fast);">联系方式</a>
          <a href="#" class="th-body-sm no-underline hover:underline" style="color: var(--th-muted-foreground); transition-duration: var(--th-duration-fast);">帮助中心</a>
        </div>
        <span class="th-body-sm" style="color: var(--th-text-400);">&copy; 2026 沃土之环</span>
      </div>
    </div>
  </footer>

  <!-- Form focus styles (in body per CSS-Ownership rules) -->
  <style>
    .form-input-focus:focus {
      border-color: var(--th-ring) !important;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--th-ring) 15%, transparent) !important;
    }
  </style>

  <!-- Tab switching & role selection scripts -->
  <script>
    lucide.createIcons();

    function switchTab(tab) {
      var loginTab = document.getElementById('tab-login');
      var registerTab = document.getElementById('tab-register');
      var loginForm = document.getElementById('form-login');
      var registerForm = document.getElementById('form-register');

      if (tab === 'login') {
        loginTab.style.color = 'var(--th-foreground)';
        loginTab.style.borderColor = 'var(--th-primary)';
        registerTab.style.color = 'var(--th-muted-foreground)';
        registerTab.style.borderColor = 'transparent';
        loginForm.classList.remove('hidden');
        loginForm.classList.add('flex');
        registerForm.classList.remove('flex');
        registerForm.classList.add('hidden');
      } else {
        registerTab.style.color = 'var(--th-foreground)';
        registerTab.style.borderColor = 'var(--th-primary)';
        loginTab.style.color = 'var(--th-muted-foreground)';
        loginTab.style.borderColor = 'transparent';
        registerForm.classList.remove('hidden');
        registerForm.classList.add('flex');
        loginForm.classList.remove('flex');
        loginForm.classList.add('hidden');
      }
    }

    function selectRole(btn) {
      var pills = document.querySelectorAll('.role-pill');
      pills.forEach(function(p) {
        p.style.backgroundColor = 'transparent';
        p.style.color = 'var(--th-muted-foreground)';
        p.style.borderColor = 'var(--th-border)';
      });
      btn.style.backgroundColor = 'var(--th-primary)';
      btn.style.color = 'var(--th-primary-foreground)';
      btn.style.borderColor = 'var(--th-primary)';
    }
  </script>
</body>
</html>
