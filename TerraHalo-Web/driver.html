<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>司机任务中心 - 沃土之环</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <script src="assets/vendor/tailwind.js"></script>
  <script src="assets/vendor/lucide.js"></script>
  <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--th-background);
    --color-foreground: var(--th-foreground);
    --color-card: var(--th-card);
    --color-card-foreground: var(--th-card-foreground);
    --color-primary: var(--th-primary);
    --color-primary-foreground: var(--th-primary-foreground);
    --color-secondary: var(--th-secondary);
    --color-secondary-foreground: var(--th-secondary-foreground);
    --color-muted: var(--th-muted);
    --color-muted-foreground: var(--th-muted-foreground);
    --color-accent: var(--th-accent);
    --color-accent-foreground: var(--th-accent-foreground);
    --color-border: var(--th-border);
    --color-input: var(--th-input);
    --color-ring: var(--th-ring);
  }
  </style>
</head>
<body class="min-h-screen antialiased" style="font-family: var(--th-font-sans); background: var(--th-background); color: var(--th-foreground);">
  <div id="th-nav"></div>

  <main class="overflow-hidden">
    <!-- 司机身份 -->
    <section class="w-full border-b" style="border-color: var(--th-border); background: var(--th-card);">
      <div class="mx-auto flex max-w-[1184px] items-center justify-between px-6 py-5 lg:px-8">
        <div class="flex items-center gap-4">
          <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full" style="background: var(--th-primary); color: var(--th-primary-foreground); font-weight: 600; font-size: var(--th-font-size-sm);" aria-label="司机小李">小</div>
          <div class="flex flex-col gap-0.5">
            <span class="th-h3 truncate" style="font-size: 1.125rem;">司机小李</span>
            <span class="th-body-sm truncate flex items-center gap-1.5 flex-wrap">
              <span class="inline-flex items-center gap-1"><i data-lucide="truck" class="h-3.5 w-3.5"></i> 苏A12345</span>
              <span style="color: var(--th-border);">·</span><span>厢式货车</span>
              <span style="color: var(--th-border);">·</span><span>5吨</span>
            </span>
          </div>
        </div>
        <button id="btn-notification" class="relative inline-flex h-9 w-9 items-center justify-center rounded-full transition-colors hover:opacity-80" style="background: var(--th-secondary); color: var(--th-muted-foreground);" aria-label="消息通知">
          <i data-lucide="bell" class="h-5 w-5"></i>
          <span class="absolute -top-0.5 -right-0.5 flex h-4 w-4 items-center justify-center rounded-full text-[10px] font-bold" style="background: var(--th-state-error); color: var(--th-background-50);">3</span>
        </button>
      </div>
    </section>

    <!-- 状态标签 -->
    <section class="w-full border-b" style="border-color: var(--th-border); background: var(--th-background);">
      <div class="mx-auto max-w-[1184px] px-6 py-3 lg:px-8">
        <div class="flex flex-nowrap gap-2 overflow-x-auto no-scrollbar" id="tabs"></div>
      </div>
    </section>

    <!-- 待接单 -->
    <section class="tab-content mx-auto max-w-[1184px] px-6 py-8 lg:px-8" id="tab-pending">
      <div class="flex flex-col gap-4" id="pending-list"></div>
    </section>

    <!-- 进行中 -->
    <section class="tab-content mx-auto max-w-[1184px] px-6 py-8 lg:px-8 hidden" id="tab-active">
      <div class="flex flex-col gap-4" id="active-list"></div>
    </section>

    <!-- 已完成 -->
    <section class="tab-content mx-auto max-w-[1184px] px-6 py-8 lg:px-8 hidden" id="tab-done">
      <div class="flex flex-col gap-3" id="done-list"></div>
    </section>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    TH.init({ nav: 'driver', active: 'tasks', footer: false });

    var tasks = JSON.parse(JSON.stringify(TH_DATA.driverTasks));
    var currentTab = 'pending';

    function countLabel(tab) {
      return tab === 'pending' ? '待接单' : (tab === 'active' ? '进行中' : '已完成');
    }

    function renderTabs() {
      var tabs = ['pending', 'active', 'done'];
      var html = tabs.map(function (t) {
        var count = tasks[t].length;
        var active = t === currentTab;
        return '<button class="tab-btn inline-flex items-center justify-center whitespace-nowrap rounded-full px-5 py-2 text-sm shrink-0 transition-all" data-tab="' + t + '" style="' +
          (active ? 'background:var(--th-primary); color:var(--th-primary-foreground); font-weight:600;' : 'background:transparent; color:var(--th-muted-foreground); border:1px solid var(--th-border); font-weight:500;') +
          '">' + countLabel(t) + ' (' + count + ')</button>';
      }).join('');
      document.getElementById('tabs').innerHTML = html;
    }

    function pendingCard(t) {
      return '<div class="task-pending flex flex-col gap-4 rounded-[var(--th-radius)] border p-5" style="border-color:var(--th-border); background:var(--th-card); box-shadow:var(--th-shadow-xs);" data-id="' + t.id + '">' +
        '<div class="flex items-start justify-between gap-4">' +
          '<div class="flex flex-col gap-1 min-w-0 flex-1">' +
            '<div class="flex items-center gap-2"><i data-lucide="map-pin" class="h-4 w-4 shrink-0" style="color:var(--th-primary);"></i><span class="th-h3 truncate">' + TH.esc(t.from) + ' → ' + TH.esc(t.to) + '</span></div>' +
            '<div class="flex flex-wrap items-center gap-3 th-body-sm">' +
              '<span class="inline-flex items-center whitespace-nowrap rounded-[var(--th-radius-sm)] px-2 py-0.5 text-xs" style="background:var(--th-secondary); color:var(--th-secondary-foreground);">' + TH.esc(t.type) + '</span>' +
              '<span style="color:var(--th-muted-foreground);">' + t.weight + '</span><span style="color:var(--th-border);">|</span>' +
              '<span class="th-mono font-semibold" style="color:var(--th-primary);">¥' + t.fee + '</span><span style="color:var(--th-border);">|</span>' +
              '<span class="inline-flex items-center gap-1" style="color:var(--th-muted-foreground);"><i data-lucide="clock" class="h-3.5 w-3.5"></i> 截止 ' + TH.esc(t.deadline) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="flex items-center gap-2 shrink-0">' +
            '<button class="btn-accept inline-flex items-center justify-center whitespace-nowrap rounded-full px-5 py-2 text-sm font-semibold transition-all hover:opacity-90 active:scale-[0.98]" style="background:var(--th-primary); color:var(--th-primary-foreground);">接单</button>' +
            '<button class="btn-reject inline-flex items-center justify-center whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors bg-transparent hover:opacity-70" style="color:var(--th-muted-foreground);">拒绝</button>' +
          '</div>' +
        '</div></div>';
    }

    function activeCard(t) {
      return '<div class="flex flex-col gap-5 rounded-[var(--th-radius)] border p-5" style="border-color:var(--th-border); background:var(--th-card); box-shadow:var(--th-shadow-xs);">' +
        '<div class="flex items-start justify-between gap-4">' +
          '<div class="flex flex-col gap-1 min-w-0 flex-1">' +
            '<div class="flex items-center gap-2"><i data-lucide="map-pin" class="h-4 w-4 shrink-0" style="color:var(--th-primary);"></i><span class="th-h3 truncate">' + TH.esc(t.from) + ' → ' + TH.esc(t.to) + '</span></div>' +
            '<div class="flex flex-wrap items-center gap-3 th-body-sm">' +
              '<span class="inline-flex items-center whitespace-nowrap rounded-[var(--th-radius-sm)] px-2 py-0.5 text-xs" style="background:var(--th-secondary); color:var(--th-secondary-foreground);">' + TH.esc(t.type) + '</span>' +
              '<span style="color:var(--th-muted-foreground);">' + t.weight + '</span><span style="color:var(--th-border);">|</span>' +
              '<span class="th-mono font-semibold" style="color:var(--th-primary);">¥' + t.fee + '</span>' +
            '</div>' +
          '</div>' +
          '<span class="inline-flex items-center whitespace-nowrap rounded-full px-3 py-1 text-xs font-semibold shrink-0" style="background:var(--th-state-warning-surface); color:var(--th-state-warning);">进行中</span>' +
        '</div>' +
        '<div style="border-top:1px solid var(--th-border);"></div>' +
        '<div class="flex flex-col gap-3">' +
          '<span class="th-body-sm" style="font-weight:600; color:var(--th-muted-foreground);">任务进度</span>' +
          '<div class="flex items-start justify-between gap-2">' +
            '<div class="flex flex-col items-center gap-1.5 flex-1 min-w-0"><div class="flex h-8 w-8 items-center justify-center rounded-full" style="background:var(--th-accent); color:var(--th-accent-foreground);"><i data-lucide="check" class="h-4 w-4"></i></div><span class="text-xs font-medium truncate" style="color:var(--th-accent);">已到场</span></div>' +
            '<div class="mt-4 h-0.5 flex-1 min-w-[20px]" style="background:var(--th-accent);"></div>' +
            '<div class="flex flex-col items-center gap-1.5 flex-1 min-w-0"><div class="flex h-8 w-8 items-center justify-center rounded-full" style="background:var(--th-primary); color:var(--th-primary-foreground);"><i data-lucide="truck" class="h-4 w-4"></i></div><span class="text-xs font-semibold truncate" style="color:var(--th-primary);">装货中</span></div>' +
            '<div class="mt-4 h-0.5 flex-1 min-w-[20px]" style="background:var(--th-border);"></div>' +
            '<div class="flex flex-col items-center gap-1.5 flex-1 min-w-0"><div class="flex h-8 w-8 items-center justify-center rounded-full" style="background:var(--th-muted); color:var(--th-muted-foreground);"><i data-lucide="circle" class="h-4 w-4"></i></div><span class="text-xs truncate" style="color:var(--th-muted-foreground);">运输中</span></div>' +
            '<div class="mt-4 h-0.5 flex-1 min-w-[20px]" style="background:var(--th-border);"></div>' +
            '<div class="flex flex-col items-center gap-1.5 flex-1 min-w-0"><div class="flex h-8 w-8 items-center justify-center rounded-full" style="background:var(--th-muted); color:var(--th-muted-foreground);"><i data-lucide="circle" class="h-4 w-4"></i></div><span class="text-xs truncate" style="color:var(--th-muted-foreground);">签收</span></div>' +
          '</div>' +
        '</div>' +
        '<div style="border-top:1px solid var(--th-border);"></div>' +
        '<div class="flex flex-wrap items-center gap-3">' +
          '<button class="btn-load inline-flex items-center justify-center whitespace-nowrap rounded-full px-5 py-2 text-sm font-semibold transition-all hover:opacity-90 active:scale-[0.98]" style="background:var(--th-primary); color:var(--th-primary-foreground);">确认装货</button>' +
          '<button class="btn-deliver inline-flex items-center justify-center whitespace-nowrap rounded-full px-5 py-2 text-sm font-semibold transition-all border hover:opacity-80 active:scale-[0.98]" style="border-color:var(--th-primary); color:var(--th-primary); background:transparent;">确认送达</button>' +
          '<button class="btn-report inline-flex items-center justify-center whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors bg-transparent hover:opacity-70" style="color:var(--th-state-error);">上报异常</button>' +
        '</div></div>';
    }

    function doneCard(t) {
      return '<div class="flex items-center gap-4 rounded-[var(--th-radius)] border p-4" style="border-color:var(--th-border); background:var(--th-card); box-shadow:var(--th-shadow-xs);">' +
        '<div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full" style="background:var(--th-state-success-surface);"><i data-lucide="check-circle" class="h-5 w-5" style="color:var(--th-state-success);"></i></div>' +
        '<div class="flex flex-col gap-0.5 min-w-0 flex-1"><span class="th-body truncate" style="font-weight:500;">' + TH.esc(t.place) + ' · ' + TH.esc(t.type) + ' · ' + t.weight + '</span><span class="th-body-sm truncate" style="color:var(--th-muted-foreground);">' + t.date + ' · 苏A12345</span></div>' +
        '<span class="th-mono font-semibold whitespace-nowrap shrink-0" style="color:var(--th-accent); font-size:var(--th-font-size-sm);">+¥' + t.fee + '</span></div>';
    }

    function render() {
      renderTabs();
      document.getElementById('pending-list').innerHTML = tasks.pending.length ? tasks.pending.map(pendingCard).join('') : '<div class="th-body-sm text-center py-12" style="color:var(--th-muted-foreground);">暂无待接单任务</div>';
      document.getElementById('active-list').innerHTML = tasks.active.length ? tasks.active.map(activeCard).join('') : '<div class="th-body-sm text-center py-12" style="color:var(--th-muted-foreground);">暂无进行中任务</div>';
      document.getElementById('done-list').innerHTML = tasks.done.length ? tasks.done.map(doneCard).join('') : '<div class="th-body-sm text-center py-12" style="color:var(--th-muted-foreground);">暂无已完成任务</div>';
      TH.refreshIcons();
    }

    function switchTab(tab) {
      currentTab = tab;
      ['pending', 'active', 'done'].forEach(function (t) {
        document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
      });
      renderTabs();
    }

    document.getElementById('tabs').addEventListener('click', function (e) {
      var btn = e.target.closest('.tab-btn');
      if (btn) switchTab(btn.getAttribute('data-tab'));
    });

    // 待接单操作
    document.getElementById('pending-list').addEventListener('click', function (e) {
      var card = e.target.closest('.task-pending');
      if (!card) return;
      var id = card.getAttribute('data-id');
      var idx = tasks.pending.findIndex(function (t) { return t.id === id; });
      if (idx < 0) return;
      var task = tasks.pending[idx];
      if (e.target.closest('.btn-accept')) {
        tasks.pending.splice(idx, 1);
        tasks.active.push({ id: 'a' + task.id, from: task.from, to: task.to, type: task.type, weight: task.weight, fee: task.fee });
        TH.toast('接单成功，任务已进入「进行中」', 'success');
        render();
      } else if (e.target.closest('.btn-reject')) {
        tasks.pending.splice(idx, 1);
        TH.toast('已拒绝该任务', 'info');
        render();
      }
    });

    // 进行中操作
    document.getElementById('active-list').addEventListener('click', function (e) {
      if (e.target.closest('.btn-load')) { TH.toast('已确认装货，任务进入运输阶段', 'success'); return; }
      if (e.target.closest('.btn-deliver')) { TH.toast('已确认送达，等待签收', 'success'); return; }
      if (e.target.closest('.btn-report')) { TH.toast('已上报异常，客服将尽快处理', 'info'); return; }
    });

    document.getElementById('btn-notification').addEventListener('click', function () { TH.toast('您有 3 条未读通知', 'info'); });

    render();
  </script>
</body>
</html>
