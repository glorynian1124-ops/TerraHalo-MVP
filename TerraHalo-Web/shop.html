<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>有机肥商城 - 沃土之环</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <script src="assets/vendor/tailwind.js"></script>
  <script src="assets/vendor/lucide.js"></script>
  <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--th-background);
    --color-foreground: var(--th-foreground);
    --color-card: var(--th-card);
    --color-card-foreground: var(--th-card-foreground);
    --color-primary: var(--th-primary);
    --color-primary-foreground: var(--th-primary-foreground);
    --color-secondary: var(--th-secondary);
    --color-secondary-foreground: var(--th-secondary-foreground);
    --color-muted: var(--th-muted);
    --color-muted-foreground: var(--th-muted-foreground);
    --color-accent: var(--th-accent);
    --color-accent-foreground: var(--th-accent-foreground);
    --color-border: var(--th-border);
    --color-input: var(--th-input);
    --color-ring: var(--th-ring);
  }
  </style>
</head>
<body style="background: var(--th-background); font-family: var(--th-font-sans); color: var(--th-foreground); min-height: 100vh;">
  <div id="th-nav"></div>

  <!-- Hero Banner -->
  <section class="relative flex min-h-[360px] items-center justify-center overflow-hidden lg:min-h-[440px]">
    <img src="assets/img/image_2_yi19x4.jpg" alt="有机肥产品展示" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0" style="background: linear-gradient(180deg, rgba(28,24,20,0.65) 0%, rgba(28,24,20,0.45) 100%);"></div>
    <div class="relative z-10 mx-auto w-full max-w-[1184px] px-6 text-center lg:px-8">
      <h1 class="th-h1" style="color: var(--th-background-50);">有机肥商城</h1>
      <p class="th-body mt-4 mx-auto max-w-lg" style="color: rgba(255,255,255,0.75);">优质有机肥，滋养每一寸土地</p>
    </div>
  </section>

  <main class="mx-auto max-w-[1184px] px-6 py-8 lg:px-8 lg:py-12">
    <div class="flex flex-col gap-6 mb-8">
      <!-- 分类筛选 -->
      <div class="flex flex-nowrap overflow-x-auto items-center gap-2 pb-1" id="cat-pills">
        <button data-cat="all" class="cat-pill shrink-0 inline-flex items-center justify-center whitespace-nowrap rounded-full px-4 py-1.5 text-sm font-semibold no-underline transition-all active:scale-[0.98]">全部</button>
        <button data-cat="bio" class="cat-pill shrink-0 inline-flex items-center justify-center whitespace-nowrap rounded-lg px-4 py-1.5 text-sm font-medium no-underline transition-all active:scale-[0.98]">生物有机肥</button>
        <button data-cat="compound" class="cat-pill shrink-0 inline-flex items-center justify-center whitespace-nowrap rounded-lg px-4 py-1.5 text-sm font-medium no-underline transition-all active:scale-[0.98]">复合微生物肥</button>
        <button data-cat="soil" class="cat-pill shrink-0 inline-flex items-center justify-center whitespace-nowrap rounded-lg px-4 py-1.5 text-sm font-medium no-underline transition-all active:scale-[0.98]">土壤调理剂</button>
      </div>

      <!-- 搜索 + 排序 -->
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div class="relative flex-1 max-w-md">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" style="width: 18px; height: 18px; color: var(--th-muted-foreground);"></i>
          <input id="search-input" type="text" placeholder="搜索有机肥产品..." class="w-full rounded-lg border py-2 pl-10 pr-4 text-sm outline-none" style="border-color: var(--th-border); background: var(--th-card); color: var(--th-foreground);">
        </div>
        <div class="flex items-center gap-3">
          <span class="th-body-sm whitespace-nowrap" style="color: var(--th-muted-foreground);">排序：</span>
          <select id="sort-select" class="rounded-lg border py-2 px-3 text-sm outline-none cursor-pointer" style="border-color: var(--th-border); background: var(--th-card); color: var(--th-foreground);">
            <option value="default">默认排序</option>
            <option value="price-asc">价格从低到高</option>
            <option value="price-desc">价格从高到低</option>
            <option value="sales">销量优先</option>
            <option value="rating">评分优先</option>
          </select>
          <span class="th-body-sm" style="color: var(--th-muted-foreground);"><span class="font-semibold" style="color: var(--th-foreground);" id="result-count">0</span> 件商品</span>
        </div>
      </div>
    </div>

    <!-- 商品网格 -->
    <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3" id="product-grid"></div>
    <div id="empty-state" class="hidden flex-col items-center gap-3 py-20 text-center">
      <span class="text-4xl" aria-hidden="true">🛒</span>
      <p class="th-body" style="color: var(--th-muted-foreground);">没有找到匹配的商品</p>
    </div>

    <!-- 分页 -->
    <div class="flex items-center justify-center gap-1 mt-12" id="pagination"></div>
  </main>

  <div id="th-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    TH.init({ nav: 'public', active: 'shop', footer: 'dark' });

    var all = [];
    var state = { cat: 'all', kw: '', sort: 'default', page: 1 };
    var PER_PAGE = 6;

    function stars(r) {
      var html = '';
      for (var i = 1; i <= 5; i++) {
        if (i <= Math.floor(r)) html += '<i data-lucide="star" class="fill-current" style="width:14px;height:14px;"></i>';
        else if (i - r < 1) html += '<i data-lucide="star-half" class="fill-current" style="width:14px;height:14px;"></i>';
        else html += '<i data-lucide="star" style="width:14px;height:14px; color:var(--th-muted-foreground);"></i>';
      }
      return html;
    }

    /* 后端商品 → 前端展示字段 */
    function normalize(p) {
      return {
        id: p.id,
        categoryId: p.category_id,
        name: p.product_name,
        spec: p.specification || '',
        price: p.price,
        marketPrice: p.market_price,
        rating: p.rating || 0,
        sold: p.sold || 0,
        stock: p.stock_qty || 0,
        img: (p.images && p.images.length && p.images[0].url) || 'assets/img/image_2_yi19x4.jpg'
      };
    }
    function load() {
      TH_API.products.list().then(function (list) {
        all = (list || []).map(normalize);
        render();
      }).catch(function (err) {
        document.getElementById('empty-state').classList.remove('hidden');
        document.getElementById('empty-state').classList.add('flex');
        TH.toast(err.message || '商品数据加载失败', 'error');
      });
    }

    function cardHtml(p) {
      return '<a href="product-detail.html?id=' + p.id + '" class="group block rounded-[var(--th-radius)] border no-underline overflow-hidden transition-all cursor-pointer" style="border-color:var(--th-border); background:var(--th-card); box-shadow:var(--th-shadow-sm);" data-id="' + p.id + '">' +
        '<div class="relative w-full overflow-hidden" style="aspect-ratio:4/3;">' +
          '<img src="' + p.img + '" alt="' + TH.esc(p.name) + '" class="w-full h-full object-cover transition-transform group-hover:scale-105" loading="lazy" onerror="this.onerror=null;this.src=&#39;assets/img/image_2_yi19x4.jpg&#39;;" style="transition-duration:350ms; transition-timing-function:cubic-bezier(0.32,0.72,0,1);">' +
        '</div>' +
        '<div class="flex flex-col gap-2 p-4">' +
          '<h3 class="th-h3 truncate" style="font-size:var(--th-font-size-h3); line-height:1.3;">' + TH.esc(p.name) + '</h3>' +
          '<p class="th-body-sm truncate" style="color:var(--th-muted-foreground);">' + TH.esc(p.spec) + '</p>' +
          '<div class="flex items-center gap-1 mt-1"><span class="th-mono" style="font-size:1.5rem; font-weight:600; color:var(--th-primary); line-height:1;">¥' + p.price + '</span></div>' +
          '<div class="flex items-center gap-1.5 mt-0.5">' +
            (p.rating > 0
              ? '<div class="flex items-center" style="color:var(--th-brown-400);">' + stars(p.rating) + '</div><span class="th-body-sm" style="font-size:0.75rem; color:var(--th-muted-foreground);">' + p.rating + ' · 已售 ' + p.sold.toLocaleString() + '</span>'
              : '<span class="th-body-sm" style="font-size:0.75rem; color:var(--th-muted-foreground);">库存 ' + p.stock + ' 件</span>') +
          '</div>' +
          '<button data-add-cart class="mt-2 inline-flex items-center justify-center whitespace-nowrap rounded-lg w-full py-2 text-sm font-semibold no-underline transition-all hover:opacity-90 active:scale-[0.98]" style="border:1px solid var(--th-border); background:transparent; color:var(--th-foreground);">加入购物车</button>' +
        '</div></a>';
    }

    function filtered() {
      var list = all.slice();
      if (state.cat !== 'all') {
        var catId = { bio: 1, compound: 4, soil: 2 }[state.cat];
        list = list.filter(function (p) { return p.categoryId === catId; });
      }
      if (state.kw) {
        var kw = state.kw.toLowerCase();
        list = list.filter(function (p) { return (p.name + p.spec).toLowerCase().indexOf(kw) !== -1; });
      }
      if (state.sort === 'price-asc') list.sort(function (a, b) { return a.price - b.price; });
      else if (state.sort === 'price-desc') list.sort(function (a, b) { return b.price - a.price; });
      else if (state.sort === 'sales') list.sort(function (a, b) { return b.sold - a.sold; });
      else if (state.sort === 'rating') list.sort(function (a, b) { return b.rating - a.rating; });
      return list;
    }

    function renderPills() {
      document.querySelectorAll('.cat-pill').forEach(function (btn) {
        var on = btn.getAttribute('data-cat') === state.cat;
        if (on) { btn.style.background = 'var(--th-primary)'; btn.style.color = 'var(--th-primary-foreground)'; }
        else { btn.style.background = 'var(--th-secondary)'; btn.style.color = 'var(--th-secondary-foreground)'; }
      });
    }

    function renderPagination(total) {
      var pages = Math.max(1, Math.ceil(total / PER_PAGE));
      var box = document.getElementById('pagination');
      if (pages <= 1) { box.innerHTML = ''; return; }
      var html = '<button data-page="prev" class="inline-flex items-center justify-center h-9 w-9 rounded-lg text-sm" style="border:1px solid var(--th-border); background:transparent; color:var(--th-muted-foreground);' + (state.page <= 1 ? 'opacity:0.4;' : '') + '"><i data-lucide="chevron-left" style="width:16px;height:16px;"></i></button>';
      for (var i = 1; i <= pages; i++) {
        var on = i === state.page;
        html += '<button data-page="' + i + '" class="inline-flex items-center justify-center h-9 w-9 rounded-lg text-sm ' + (on ? 'font-semibold' : 'font-medium') + '" style="' + (on ? 'background:var(--th-primary); color:var(--th-primary-foreground);' : 'border:1px solid var(--th-border); background:transparent; color:var(--th-foreground);') + '">' + i + '</button>';
      }
      html += '<button data-page="next" class="inline-flex items-center justify-center h-9 w-9 rounded-lg text-sm" style="border:1px solid var(--th-border); background:transparent; color:var(--th-foreground);' + (state.page >= pages ? 'opacity:0.4;' : '') + '"><i data-lucide="chevron-right" style="width:16px;height:16px;"></i></button>';
      box.innerHTML = html;
    }

    function render() {
      var list = filtered();
      document.getElementById('result-count').textContent = list.length;
      var pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
      if (state.page > pages) state.page = pages;
      var items = list.slice((state.page - 1) * PER_PAGE, state.page * PER_PAGE);
      document.getElementById('product-grid').innerHTML = items.map(cardHtml).join('');
      document.getElementById('empty-state').classList.toggle('hidden', list.length !== 0);
      document.getElementById('empty-state').classList.toggle('flex', list.length === 0);
      renderPills();
      renderPagination(list.length);
      TH.refreshIcons();
    }

    function addToCart(p, qty) {
      TH.Cart.add({ id: p.id, name: p.name, spec: p.spec, price: p.price, img: p.img, qty: qty || 1 });
      TH.toast('已加入购物车', 'success');
    }

    document.getElementById('search-input').addEventListener('input', function (e) { state.kw = e.target.value.trim(); state.page = 1; render(); });
    document.getElementById('sort-select').addEventListener('change', function (e) { state.sort = e.target.value; state.page = 1; render(); });
    document.getElementById('cat-pills').addEventListener('click', function (e) {
      var btn = e.target.closest('.cat-pill');
      if (!btn) return;
      state.cat = btn.getAttribute('data-cat');
      state.page = 1;
      render();
    });
    document.getElementById('pagination').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-page]');
      if (!btn) return;
      var p = btn.getAttribute('data-page');
      if (p === 'prev') state.page = Math.max(1, state.page - 1);
      else if (p === 'next') state.page = state.page + 1;
      else state.page = parseInt(p, 10);
      render();
    });
    document.getElementById('product-grid').addEventListener('click', function (e) {
      var addBtn = e.target.closest('[data-add-cart]');
      if (addBtn) {
        e.preventDefault();
        e.stopPropagation();
        var card = addBtn.closest('a');
        var pid = card.getAttribute('data-id');
        var p = all.find(function (x) { return String(x.id) === pid; });
        if (p) addToCart(p);
        return;
      }
      var card = e.target.closest('a[data-id]');
      if (card) location.href = 'product-detail.html?id=' + card.getAttribute('data-id');
    });

    load();
  </script>
</body>
</html>
