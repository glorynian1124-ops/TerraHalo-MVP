{% extends "base.html" %}

{% block title %}登录 - 沃土之环{% endblock %}

{% block content %}
<main class="flex-1 flex flex-col md:flex-row" style="min-height: calc(100vh - 44px);">
    <!-- 左侧品牌面板 -->
    <div class="w-full md:w-[45%] lg:w-[42%] flex items-center justify-center px-8 py-12 md:py-0" style="background: linear-gradient(160deg, var(--th-brown-100) 0%, var(--th-background-200) 40%, var(--th-green-100) 100%);">
        <div class="text-center max-w-sm">
            <span class="text-6xl md:text-7xl leading-none block mb-6 select-none" role="img" aria-label="沃土之环">🌱</span>
            <h1 class="th-h1 mb-4">沃土之环</h1>
            <p class="th-body" style="color: var(--th-muted-foreground); max-width: 280px; margin-left: auto; margin-right: auto;">绿色农业 · 循环经济</p>
            <div class="mt-10 hidden md:block" style="width: 48px; height: 1px; background-color: var(--th-border); margin-left: auto; margin-right: auto;"></div>
            <p class="th-body-sm mt-6 hidden md:block" style="color: var(--th-text-400); max-width: 260px; margin-left: auto; margin-right: auto;">连接农田与工厂，让每一份废弃物都重获新生</p>
        </div>
    </div>

    <!-- 右侧表单 -->
    <div class="w-full md:w-[55%] lg:w-[58%] flex items-center justify-center px-4 sm:px-8 py-8 md:py-0">
        <div class="w-full max-w-md">
            <div class="w-full p-6 sm:p-8" style="background-color: var(--th-card); border: 1px solid var(--th-border); border-radius: var(--th-radius);">
                <h2 class="th-h2 mb-6" style="font-size: 1.5rem;">欢迎回来</h2>
                <form id="form-login" class="flex flex-col gap-5" onsubmit="return doLogin(event);">
                    <div class="flex flex-col gap-1.5">
                        <label class="th-body-sm font-medium" style="color: var(--th-foreground);">用户名</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2" style="width: 18px; height: 18px; color: var(--th-muted-foreground); pointer-events: none;"></i>
                            <input type="text" id="login-username" placeholder="请输入用户名" class="w-full th-body outline-none transition-all pl-10 pr-4 form-input-focus" style="height: 44px; border: 1px solid var(--th-input); border-radius: var(--th-radius); background-color: var(--th-background); color: var(--th-foreground); font-family: var(--th-font-sans);">
                        </div>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="th-body-sm font-medium" style="color: var(--th-foreground);">密码</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2" style="width: 18px; height: 18px; color: var(--th-muted-foreground); pointer-events: none;"></i>
                            <input type="password" id="login-password" placeholder="请输入密码" class="w-full th-body outline-none transition-all pl-10 pr-4 form-input-focus" style="height: 44px; border: 1px solid var(--th-input); border-radius: var(--th-radius); background-color: var(--th-background); color: var(--th-foreground); font-family: var(--th-font-sans);">
                        </div>
                    </div>
                    <div class="flex items-center justify-between mt-1">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" class="w-4 h-4 rounded" style="accent-color: var(--th-primary);">
                            <span class="th-body-sm" style="color: var(--th-muted-foreground);">记住我</span>
                        </label>
                    </div>
                    <button type="submit" class="w-full flex items-center justify-center whitespace-nowrap font-semibold text-base border-none cursor-pointer transition-all mt-2 hover:opacity-90 active:scale-[0.98]" style="height: 48px; padding: 0 1.5rem; border-radius: var(--th-radius-full); background-color: var(--th-primary); color: var(--th-primary-foreground);">登录</button>
                </form>
                <div class="mt-6 pt-5 border-t text-center" style="border-color: var(--th-border);">
                    <span class="th-body-sm" style="color: var(--th-muted-foreground);">还没有账号？</span>
                    <a href="{{ url_for('auth.register_page') }}" class="th-body-sm no-underline font-semibold" style="color: var(--th-primary);">立即注册</a>
                </div>
            </div>
            <p class="th-body-sm text-center mt-6" style="color: var(--th-muted-foreground);">
                登录即表示同意 <a href="#" class="no-underline hover:underline" style="color: var(--th-primary);">服务条款</a> 和 <a href="#" class="no-underline hover:underline" style="color: var(--th-primary);">隐私政策</a>
            </p>
        </div>
    </div>
</main>
{% endblock %}

{% block extra_js %}
<style>
    .form-input-focus:focus { border-color: var(--th-ring) !important; box-shadow: 0 0 0 3px color-mix(in srgb, var(--th-ring) 15%, transparent) !important; }
</style>
<script>
    function doLogin(e) {
        e.preventDefault();
        var username = document.getElementById('login-username').value.trim();
        var password = document.getElementById('login-password').value;
        if (!username || !password) { thToast('请输入用户名和密码', 'error'); return false; }
        fetchJSON('{{ url_for("auth.login_api") }}', {
            method: 'POST',
            body: JSON.stringify({username: username, password: password})
        }).then(function(d) {
            if (d.message) {
                thToast('登录成功', 'success');
                setTimeout(function() { window.location.href = '{{ url_for("main.home") }}'; }, 600);
            } else {
                thToast(d.error || '登录失败', 'error');
            }
        }).catch(function() { thToast('网络错误，请稍后重试', 'error'); });
        return false;
    }
</script>
{% endblock %}
