<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业情况 - 沃土之环</title>
  <meta name="description" content="沃土之环企业总览：入驻企业档案、经营统计与上架单品">
  <link rel="stylesheet" href="assets/css/theme.css">
  <script src="assets/vendor/tailwind.js"></script>
  <script src="assets/vendor/lucide.js"></script>
  <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--th-background);
    --color-foreground: var(--th-foreground);
    --color-card: var(--th-card);
    --color-card-foreground: var(--th-card-foreground);
    --color-primary: var(--th-primary);
    --color-primary-foreground: var(--th-primary-foreground);
    --color-secondary: var(--th-secondary);
    --color-secondary-foreground: var(--th-secondary-foreground);
    --color-muted: var(--th-muted);
    --color-muted-foreground: var(--th-muted-foreground);
    --color-accent: var(--th-accent);
    --color-accent-foreground: var(--th-accent-foreground);
    --color-border: var(--th-border);
    --color-input: var(--th-input);
    --color-ring: var(--th-ring);
  }
  </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background:var(--th-background);">

  <!-- 顶栏 -->
  <header class="sticky top-0 z-40 border-b" style="background:color-mix(in srgb, var(--th-background-50) 85%, transparent); backdrop-filter:blur(16px); border-color:var(--th-border);">
    <div class="mx-auto flex h-16 max-w-[1400px] items-center justify-between px-4 sm:px-6">
      <a href="index.html" class="flex items-center gap-3 no-underline">
        <span class="text-2xl leading-none" aria-hidden="true">🌱</span>
        <div class="flex flex-col leading-tight">
          <span class="th-h3" style="font-size:1.05rem; color:var(--th-foreground);">沃土之环 · 企业情况</span>
          <span class="th-eyebrow" style="font-size:0.625rem;">ENTERPRISE OVERVIEW</span>
        </div>
      </a>
      <div class="flex items-center gap-3">
        <button id="btn-refresh" class="inline-flex items-center gap-2 rounded-full px-4 py-2 text-sm font-medium transition-all hover:opacity-85" style="background:var(--th-secondary); color:var(--th-foreground);"><span data-lucide="refresh-cw" class="w-4 h-4"></span>刷新</button>
        <a href="admin.html" class="no-underline"><span class="inline-flex h-9 w-9 items-center justify-center rounded-full text-sm font-semibold" style="background:var(--th-primary); color:var(--th-primary-foreground);">管</span></a>
      </div>
    </div>
  </header>

  <div class="mx-auto max-w-[1400px] px-4 py-6 sm:px-6">
    <!-- 顶部统计条 -->
    <div class="grid grid-cols-2 gap-4 md:grid-cols-5" id="kpi-row"></div>

    <!-- 企业列表 -->
    <div class="mt-6 flex flex-col gap-5" id="ent-list">
      <div class="py-16 text-center th-body-sm" style="color:var(--th-muted-foreground);">加载中…</div>
    </div>
  </div>

  <style>
    .ent-card { transition: box-shadow var(--th-duration-base) var(--th-ease), transform var(--th-duration-base) var(--th-ease); }
    .ent-card:hover { box-shadow: var(--th-shadow-lg); }
    .ent-spec-row { transition: background var(--th-duration-fast) var(--th-ease); }
    .ent-spec-row:hover { background: var(--th-muted); }
  </style>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    (function () {
      'use strict';
      if (!window.TH_API) return;

      function esc(s) { return TH.esc(s); }
      function money(n) { return '¥' + TH.fmtMoney(Number(n || 0)); }
      function badge(text, kind) {
        var map = {
          success: ['var(--th-state-success-surface)', 'var(--th-state-success)'],
          warning: ['color-mix(in srgb, var(--th-brown-100) 70%, transparent)', 'var(--th-brown-600)'],
          error: ['var(--th-state-error-surface)', 'var(--th-state-error)'],
          neutral: ['var(--th-secondary)', 'var(--th-secondary-foreground)']
        };
        var c = map[kind] || map.neutral;
        return '<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium" style="background:' + c[0] + '; color:' + c[1] + ';">' + esc(text) + '</span>';
      }
      function authBadge(s) {
        if (s === 'approved') return badge('已认证', 'success');
        if (s === 'pending') return badge('待审核', 'warning');
        if (s === 'rejected') return badge('已拒绝', 'error');
        return badge(s || '-', 'neutral');
      }
      function prodBadge(s) {
        if (s === 'online') return badge('已上架', 'success');
        if (s === 'pending_audit') return badge('待审核', 'warning');
        if (s === 'offline') return badge('已下架', 'neutral');
        return badge(s, 'neutral');
      }
      function fmtDate(iso) { return iso ? String(iso).slice(0, 10) : '-'; }
      var TYPE_TEXT = { organic_fertilizer: '有机肥生产', recycle: '原料回收', distribution: '流通贸易', other: '其他' };

      function entType(t) { return TYPE_TEXT[t] || t || '-'; }

      /* 顶部统计条（跨企业汇总） */
      function renderKpi(list) {
        var total = list.length;
        var active = list.filter(function (e) { return e.user_status === 'normal'; }).length;
        var sumWeek = 0, sumMonth = 0, sumYear = 0, sumImportYear = 0;
        list.forEach(function (e) {
          sumWeek += (e.sales && e.sales.week.amount) || 0;
          sumMonth += (e.sales && e.sales.month.amount) || 0;
          sumYear += (e.sales && e.sales.year.amount) || 0;
          sumImportYear += (e.imports && e.imports.year) || 0;
        });
        var items = [
          ['注册企业', total, '家'],
          ['在营企业', active, '家'],
          ['本周成交', money(sumWeek), ''],
          ['本月成交', money(sumMonth), ''],
          ['本年成交', money(sumYear), '· 原料 ' + sumImportYear + ' 吨']
        ];
        document.getElementById('kpi-row').innerHTML = items.map(function (it) {
          return '<div class="rounded-2xl border p-5" style="border-color:var(--th-border); background:var(--th-card);">' +
            '<span class="th-body-sm" style="color:var(--th-muted-foreground);">' + it[0] + '</span>' +
            '<span class="th-mono mt-1 block" style="font-size:1.6rem; font-weight:700; color:var(--th-primary);">' + it[1] + '</span>' +
            (it[2] ? '<span class="th-body-sm" style="color:var(--th-muted-foreground);">' + it[2] + '</span>' : '') +
          '</div>';
        }).join('');
      }

      /* 企业卡片 */
      function cardHtml(e) {
        var s = e.sales || {};
        var im = e.imports || {};
        var pros = e.products || [];
        var specRows = pros.map(function (p) {
          return '<tr class="ent-spec-row border-b" style="border-color:var(--th-border);">' +
            '<td class="px-4 py-2.5"><span class="font-medium" style="color:var(--th-foreground);">' + esc(p.product_name) + '</span><span class="th-body-sm ml-2">' + esc(p.specification || '') + '</span></td>' +
            '<td class="px-4 py-2.5">' + prodBadge(p.status) + '</td>' +
            '<td class="px-4 py-2.5 text-right th-mono" style="color:var(--th-primary); font-weight:600;">' + money(p.price) + '</td>' +
            '<td class="px-4 py-2.5 text-right th-mono">' + (p.stock_qty || 0) + '</td>' +
            '<td class="px-4 py-2.5 text-right th-mono" style="color:var(--th-state-success); font-weight:600;">' + (p.sold_qty || 0) + ' 件</td>' +
            '<td class="px-4 py-2.5 text-right th-mono">' + money(p.sold_amount) + '</td>' +
          '</tr>';
        }).join('');

        return '<div class="ent-card overflow-hidden rounded-3xl border" style="border-color:var(--th-border); background:var(--th-card);">' +
          '<div class="flex flex-col gap-6 p-6 lg:flex-row lg:items-start lg:justify-between">' +
            /* 左：企业档案 */
            '<div class="min-w-0 flex-1">' +
              '<div class="flex flex-wrap items-center gap-3"><h2 class="th-h3" style="font-size:1.3rem;">' + esc(e.enterprise_name) + '</h2>' + authBadge(e.audit_status) + badge(entType(e.enterprise_type), 'neutral') + '</div>' +
              '<div class="mt-3 grid grid-cols-1 gap-x-8 gap-y-2 text-sm sm:grid-cols-2">' +
                '<div class="flex items-center gap-2"><span data-lucide="map-pin" class="w-4 h-4" style="color:var(--th-muted-foreground);"></span><span style="color:var(--th-muted-foreground);">地址</span><span style="color:var(--th-foreground);">' + esc(e.address || '-') + '</span></div>' +
                '<div class="flex items-center gap-2"><span data-lucide="user" class="w-4 h-4" style="color:var(--th-muted-foreground);"></span><span style="color:var(--th-muted-foreground);">联系人</span><span style="color:var(--th-foreground);">' + esc(e.contact_name || '-') + ' ' + esc(e.contact_mobile || '') + '</span></div>' +
                '<div class="flex items-center gap-2"><span data-lucide="calendar" class="w-4 h-4" style="color:var(--th-muted-foreground);"></span><span style="color:var(--th-muted-foreground);">入驻</span><span style="color:var(--th-foreground);">' + fmtDate(e.created_at) + '</span></div>' +
                '<div class="flex items-center gap-2"><span data-lucide="package" class="w-4 h-4" style="color:var(--th-muted-foreground);"></span><span style="color:var(--th-muted-foreground);">上架单品</span><span style="color:var(--th-foreground);">' + (e.online_products || 0) + ' / ' + (e.product_count || 0) + ' 个</span></div>' +
              '</div>' +
            '</div>' +
            /* 右：经营统计 */
            '<div class="w-full shrink-0 lg:w-[420px]">' +
              '<table class="w-full text-sm">' +
                '<thead><tr class="th-body-sm" style="color:var(--th-muted-foreground);"><th class="pb-2 text-left font-medium">周期</th><th class="pb-2 text-right font-medium">产品销量</th><th class="pb-2 text-right font-medium">原料进口</th></tr></thead>' +
                '<tbody>' +
                  '<tr class="border-t" style="border-color:var(--th-border);"><td class="py-2 font-medium" style="color:var(--th-foreground);">本周</td><td class="py-2 text-right th-mono">' + (s.week ? s.week.qty : 0) + ' 件 · ' + money(s.week && s.week.amount) + '</td><td class="py-2 text-right th-mono" style="color:var(--th-state-warning);">' + (im.week || 0) + ' 吨</td></tr>' +
                  '<tr class="border-t" style="border-color:var(--th-border);"><td class="py-2 font-medium" style="color:var(--th-foreground);">本月</td><td class="py-2 text-right th-mono">' + (s.month ? s.month.qty : 0) + ' 件 · ' + money(s.month && s.month.amount) + '</td><td class="py-2 text-right th-mono" style="color:var(--th-state-warning);">' + (im.month || 0) + ' 吨</td></tr>' +
                  '<tr class="border-t" style="border-color:var(--th-border);"><td class="py-2 font-medium" style="color:var(--th-foreground);">本年</td><td class="py-2 text-right th-mono">' + (s.year ? s.year.qty : 0) + ' 件 · ' + money(s.year && s.year.amount) + '</td><td class="py-2 text-right th-mono" style="color:var(--th-state-warning);">' + (im.year || 0) + ' 吨</td></tr>' +
                '</tbody>' +
              '</table>' +
            '</div>' +
          '</div>' +
          /* 单品清单 */
          '<div class="border-t" style="border-color:var(--th-border); background:var(--th-muted);">' +
            '<button class="spec-toggle flex w-full items-center justify-between px-6 py-3 text-left" style="border:none; background:transparent; cursor:pointer;">' +
              '<span class="th-body-sm font-semibold" style="color:var(--th-foreground);">上架单品明细（' + pros.length + '）</span>' +
              '<span data-lucide="chevron-down" class="spec-ico w-4 h-4 transition-transform" style="color:var(--th-muted-foreground);"></span>' +
            '</button>' +
            '<div class="spec-body hidden overflow-x-auto px-6 pb-4">' +
              (pros.length ? '<table class="w-full text-sm"><thead><tr class="th-body-sm" style="color:var(--th-muted-foreground);"><th class="px-4 py-2 text-left font-medium">单品</th><th class="px-4 py-2 text-left font-medium">状态</th><th class="px-4 py-2 text-right font-medium">价格</th><th class="px-4 py-2 text-right font-medium">库存</th><th class="px-4 py-2 text-right font-medium">累计销量</th><th class="px-4 py-2 text-right font-medium">销售额</th></tr></thead><tbody>' + specRows + '</tbody></table>'
               : '<div class="py-8 text-center th-body-sm" style="color:var(--th-muted-foreground);">该企业暂无上架单品</div>') +
            '</div>' +
          '</div>' +
        '</div>';
      }

      function load() {
        TH_API.admin.enterpriseOverview().then(function (list) {
          list = list || [];
          document.getElementById('ent-list').innerHTML = list.map(cardHtml).join('') || '<div class="py-16 text-center th-body-sm" style="color:var(--th-muted-foreground);">暂无企业数据</div>';
          renderKpi(list);
          TH.refreshIcons();
        }).catch(function (err) {
          document.getElementById('ent-list').innerHTML = '<div class="py-16 text-center th-body-sm" style="color:var(--th-state-error);">' + esc(err.message || '企业数据加载失败') + '</div>';
          TH.toast(err.message || '企业数据加载失败', 'error');
        });
      }

      /* 单品明细展开 */
      document.getElementById('ent-list').addEventListener('click', function (e) {
        var btn = e.target.closest('.spec-toggle');
        if (!btn) return;
        var body = btn.nextElementSibling;
        var ico = btn.querySelector('.spec-ico');
        body.classList.toggle('hidden');
        if (ico) ico.style.transform = body.classList.contains('hidden') ? '' : 'rotate(180deg)';
      });

      document.getElementById('btn-refresh').addEventListener('click', load);
      load();
    })();
  </script>
</body>
</html>
