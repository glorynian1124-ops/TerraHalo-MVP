<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沃土之环 - 农户端</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .hero-section { color: white; padding: 60px 0; text-align: center; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">🌱 沃土之环 - 农户端</a>
            <button class="btn btn-outline-light" onclick="window.location.href='http://127.0.0.1:5000/'">返回后端</button>
        </div>
    </nav>
    
    <div class="hero-section">
        <div class="container">
            <h1 class="display-4">欢迎，农户朋友！</h1>
            <p class="lead mt-3">这里是您的专属平台，发布供应、管理订单</p>
            <hr class="my-4">
            <p class="mb-4">沃土之环 - 连接农业供需的桥梁</p>
            <a class="btn btn-primary btn-lg" href="http://127.0.0.1:5000/" role="button">前往完整系统</a>
        </div>
    </div>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <h3 class="card-title">📦 发布供应</h3>
                        <p class="card-text">发布您的农产品或农业废弃物</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <h3 class="card-title">📋 订单管理</h3>
                        <p class="card-text">查看和处理采购订单</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <h3 class="card-title">💳 收入结算</h3>
                        <p class="card-text">查看和管理您的收入</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
